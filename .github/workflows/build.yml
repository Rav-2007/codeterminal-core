name: build

on:
  # EVERY branch, not just main.
  #
  # This used to be `branches: [main]`, which meant a feature branch could be
  # pushed and receive no verification at all -- the branch carrying 13 commits
  # of security work sat on the remote with CI having never once looked at it.
  # Waiting for a PR to find out whether the code compiles inverts the order you
  # want: the point of CI is to know BEFORE you ask someone to merge it.
  #
  # NOT for a push that changes only markdown. `paths-ignore` skips the run only
  # when EVERY changed file matches it, so a commit touching both code and docs
  # still runs the full matrix -- this buys nothing back from a mixed push, and
  # is not a hole. It is safe for the jobs this trigger controls, because none of
  # them depends on a .md file: there is no markdown under any testdata/, no
  # `go:embed` of a .md, and no UNTAGGED test that reads one (the `"README.md"`
  # strings in editapply's tests are literals in path-hazard tables, not files
  # opened from disk).
  #
  # CORRECTION, 2026-08-08: that last clause first said "no test that reads one",
  # full stop, and that is wrong. `daemon/agentloop_eval_test.go` is `//go:build
  # eval` and asks the model to read `mcp-servers/README.md` and
  # `clients/vscode/README.md` as a real fixture, so editing either of those CAN
  # change an eval outcome. It does not make this trigger unsafe -- the eval job
  # is schedule/dispatch-only and was never on the push path, so paths-ignore
  # neither covers it nor changed it. But it does mean those two files are test
  # fixtures rather than deletable stubs, and a markdown-only push will not tell
  # you if one of them broke the eval. The Monday schedule is what tells you.
  #
  # The usual footgun -- a skipped workflow leaving a REQUIRED status check
  # pending forever -- cannot bite here, because this repo has no required
  # checks: branch protection is unavailable on a private free-plan repo, as the
  # `go` job's comment below records. Re-check this if the repo ever goes public
  # or onto Pro.
  #
  # This was measured, not guessed. A three-file markdown-only push
  # (docs/readme-rewrite, run 31234293957) queued the whole Linux matrix plus
  # the Windows cross job -- roughly 50-60 billable minutes to re-prove that
  # unchanged Go still compiles. On main it would also have paid macOS at 10x.
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  # Kept, and deliberately narrower. A pull_request run tests the MERGE RESULT
  # (branch + current main), which is a different question from the branch head
  # the push run tested, and the only one that catches "fine alone, broken
  # against what landed meanwhile".
  #
  # WHICH JOBS ACTUALLY HONOUR THAT, because for a long time none did. Every job
  # carried a same-repo PR skip, and this repo is private with no forks, so
  # every PR skipped everything except `proxy-image` -- the merge-result run
  # this comment describes never happened once. The `go` job now runs on
  # same-repo PRs; lint, fuzz, cross, govulncheck and extension still skip,
  # because their answers do not change under a merge. See the `go` job.
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  # The eval job below is schedule/dispatch-only; these triggers exist so it has
  # something to hang off. Everything else runs per-push; on a same-repo PR only
  # `go` and `proxy-image` re-run (see above).
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Cancel a run that a newer push to the same ref has already superseded. Pushing
# three times in a minute should cost one run's minutes, not three -- this repo
# is private on a free plan, where Actions minutes are a finite monthly budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# There is no root Go module -- only go.work -- so `./...` from the repo root
# fails outright ("directory prefix . does not contain modules listed in
# go.work"). Every Go step below therefore names its module explicitly. Do not
# "simplify" these to a root-level ./... ; it does not work.
env:
  GO_VERSION: "1.25.13"

# WHERE THE LINUX JOBS RUN, and why it is a variable rather than a literal.
#
# Actions bills a private repo 2,000 minutes a month and one full run of this
# workflow costs 86 of them (see the `cross` matrix comment for the breakdown),
# so the quota buys roughly 23 pushes. Self-hosted runners are billed NOTHING and
# have no cap, which is the only lever here that removes the ceiling rather than
# raising it.
#
# `vars.LINUX_RUNNER` is a repository variable, and UNSET means ubuntu-latest --
# i.e. the default behaviour is exactly what it was before this existed. Set it
# to `self-hosted` to move the Linux jobs onto a registered runner; unset it to
# come straight back. That matters more than saving an edit: a self-hosted job
# whose runner is offline QUEUES rather than fails, so the escape hatch has to be
# one click and not a commit.
#
# NOT every Linux job. `extension` needs xvfb-run and `proxy-image` needs docker,
# and both would need root to install; they stay on hosted runners where those
# are guaranteed. The 19 jobs that do move (go, lint, govulncheck x6 modules each,
# plus fuzz) need only Go, which setup-go installs into the runner's own cache.
#
# THE OTHER SWITCH, `vars.HOSTED_RUNNERS_DISABLED`, is the quota escape hatch and
# is meant to be TEMPORARY. Moving the Linux jobs onto a self-hosted runner does
# not help while the account is at zero minutes, because the Windows `cross` jobs
# still bill at 2x and would fail the run on their own. Setting this variable to
# `true` skips every job that needs a hosted runner -- cross, extension,
# proxy-image -- so a push can go fully green on the self-hosted runner alone.
#
# BE HONEST ABOUT WHAT THAT COSTS: with it set there is NO Windows or macOS
# verification, no VS Code extension test and no proxy image build. That is a
# real reduction in what CI proves, not a free win. Unset it when the monthly
# quota resets, and do not leave it set on a run that is about to reach main.
#
# SAFE HERE BECAUSE THE REPO IS PRIVATE. A self-hosted runner on a PUBLIC repo is
# a documented remote-code-execution hole -- anyone's fork PR runs on your
# hardware. Do not set this variable if this repo is ever made public.
jobs:
  go:
    # 584 Go tests, gofmt, and vet existed in this repo and gated nothing: the
    # entire pipeline was one docker build. Both regressions in the 2026-07-30
    # launch-gate review shipped past a green LOCAL suite, because a suite nobody
    # is required to run is a suite that drifts. This job makes the suite run on
    # every push and PR to main.
    #
    # It does NOT yet BLOCK anything, and that distinction matters. Required
    # status checks need branch protection, and branch protection is unavailable
    # on this repo: it is private on a free plan, so
    # `GET /repos/:owner/:repo/branches/main/protection` answers
    # `403 Upgrade to GitHub Pro or make this repository public` (checked
    # 2026-07-30). Until the repo goes public or onto Pro, a red run is a signal
    # someone has to read, not a merge that cannot happen. Making it enforceable
    # is tracked in BACKLOG.md.
    name: go (${{ matrix.module }})
    # NO same-repo PR skip on this job, deliberately, and it is the only job
    # without one.
    #
    # The other five still skip, and the reason they can is that their questions
    # do not change under a merge: a lint rule, a fuzz target or a vulnerable
    # dependency is as true of the branch head as of the merge result, and the
    # push run already answered it. This job's question does change. "Compiles
    # and passes alone, broken against what landed meanwhile" is a property of
    # the MERGE, and build/vet/test is what detects it.
    #
    # The skip used to be here too, which made the pull_request trigger
    # decorative: this repo is private with no forks, so EVERY PR is same-repo,
    # so every job skipped and a PR ran nothing but `docker build ./proxy`. The
    # trigger's own comment above said it existed to test the merge result --
    # the one thing it was then structurally unable to do.
    #
    # Cost is the reason the other five keep the skip rather than all six losing
    # it: this restores merge verification for roughly a third of what running
    # the whole matrix twice would cost, on a repo that exhausted its Actions
    # quota on 2026-08-31.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        module: [daemon, editapply, proxy, helper, protocol, clients/tui]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      # The sandbox under test. Without bubblewrap installed, WrapCommand falls
      # back, the tests that EXECUTE a sandbox skip themselves with NOT RUN, and
      # daemon/mcp coverage drops from ~91% to 89.2% -- straight through its
      # 91.0 floor. Measured, not guessed: that is what turned this job red on
      # its first ever run.
      #
      # Installing it here is the right fix rather than a workaround. A
      # developer's machine may forbid user namespaces (Ubuntu 24.04+ desktops
      # do by default), so CI is the one place the confinement claims can be
      # verified on every commit. That is the whole point of the job.
      #
      # The probe is deliberate: apt succeeding proves the binary is PRESENT,
      # which this campaign has twice mistaken for it being USABLE. If it cannot
      # create a namespace, say so loudly here rather than let it surface later
      # as an unexplained coverage drop.
      - name: Install bubblewrap
        if: matrix.module == 'daemon'
        run: |
          # Only reach for apt when bwrap is genuinely missing. A self-hosted
          # runner (see LINUX_RUNNER above) has no passwordless sudo, so an
          # unconditional apt-get fails the job on a machine that already has
          # the binary. Hosted runners take the install path exactly as before.
          if command -v bwrap >/dev/null 2>&1; then
            echo "bwrap already present, skipping apt"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq bubblewrap
          fi
          bwrap --version

          # GitHub's ubuntu-latest carries the same Ubuntu 24.04+ default a
          # modern desktop does: kernel.apparmor_restrict_unprivileged_userns=1,
          # under which bwrap installs fine and then dies with "setting up uid
          # map: Permission denied". The first run of this step proved it.
          #
          # Relax it HERE, on a throwaway VM that is destroyed after the job, so
          # the confinement tests actually execute. Skipping them instead is the
          # bad trade: bwrap is unusable on Ubuntu desktops too, so CI would be
          # the second environment in a row where the sandbox is never
          # exercised -- and a sandbox nobody executes is how --nosuid survived
          # two green campaigns.
          #
          # REVIEWED 2026-09-09 against CI-2 ("a gate that passes by configuring
          # the host rather than by the code being correct lies to developers"),
          # and KEPT, with the scope of the lie narrowed and stated.
          #
          # What was a lie and is now fixed: the REFUSAL path.
          # TestEveryUnrunnableSandboxRefusesWithAReason asserted the
          # WorkspaceRoot message unconditionally, so it was green here -- on a
          # relaxed host -- and RED for every developer on a stock Ubuntu 24.04,
          # where userns restriction is the default. It now selects its
          # expectation from BwrapUsable(), and the unusable-host refusal is
          # asserted deterministically by TestBubblewrapRefusalOnAnUnusableHost,
          # which stubs the probe and therefore runs identically everywhere.
          #
          # WHAT IS STILL TRUE, AND IS NOT FIXED BY THAT: the CONFINEMENT tests
          # -- the ones that check bwrap actually isolates anything -- need a
          # real user namespace and cannot be stubbed. Their only execution
          # anywhere is on this host, after this line. That is a real reason,
          # not a convenience, and it is why the relaxation stays. It also means
          # the sandbox's confinement claims rest on an environment CI
          # configures for itself, which no developer reproduces by default.
          # `|| true` and the -n: on a self-hosted runner sudo would block for a
          # password forever rather than fail, and the probe below is what
          # actually decides whether the sandbox tests can run. Relaxing this is
          # a nicety on a throwaway VM and must never hang a real machine.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi

          # Probe AFTER relaxing, because apt succeeding only proves presence.
          if bwrap --ro-bind / / --unshare-user --die-with-parent /bin/true; then
            echo "::notice::bwrap CAN create a user namespace - sandbox tests will execute"
          else
            echo "::warning::bwrap CANNOT create a user namespace - sandbox tests will skip and daemon/mcp coverage will fall below its floor"
          fi

      - name: Build
        run: go build ./...
        working-directory: ${{ matrix.module }}

      # gofmt -l prints offending files and exits 0, so the output is the signal.
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...
        working-directory: ${{ matrix.module }}

      # THE BUILD-TAGGED FILES. An untagged vet does not compile them, so
      # daemon's eval and warnscan suites were built by nothing in CI.
      #
      # They were added to `make check` and recorded as covered. CI does not run
      # make check -- it runs the individual steps in this file -- so the gate
      # fired only for whoever chose to run it locally. That is the same failure
      # this repo has now corrected three times (action pinning, warnscan
      # itself, and this), and the reason it keeps recurring is that adding a
      # check to `make check` LOOKS like wiring it up.
      #
      # Cheap: this compiles the tagged test files, it does not run them. The
      # eval suite itself stays schedule-only for the reasons the eval job
      # records -- what was missing was knowing the code still BUILDS.
      - name: Vet (build-tagged suites)
        if: matrix.module == 'daemon'
        run: |
          go vet -tags eval ./...
          go vet -tags warnscan ./...
        working-directory: ${{ matrix.module }}

      # -race, not a bare `go test`: this repo's concurrency work (the Gate 6
      # apply/undo locking in particular) is only defended by the race detector.
      - name: Test
        # MOCHIII_REQUIRE_SANDBOX makes the bubblewrap confinement tests
        # FAIL instead of skip when bwrap cannot create a user namespace.
        #
        # Set only for daemon, which is the module that owns them, and set
        # because the step above has already PROVED bwrap works here by running
        # one. Without this, the evidence that those tests executed in CI was an
        # inference: the probe passes in one step, the tests run in another, and
        # `go test` without -v prints nothing for a skip -- so silently losing
        # the sandbox again would look identical to a green run. It is the exact
        # failure mode that let --nosuid survive two campaigns marked CONFIRMED,
        # so it gets a tripwire rather than a comment.
        env:
          MOCHIII_REQUIRE_SANDBOX: ${{ matrix.module == 'daemon' && '1' || '' }}
        # -count=1: setup-go restores the build cache between runs, so without
        # it `go test` can serve a PASS computed before the commit under test.
        # The local gate carries the same flag for the same reason.
        run: go test -race -count=1 ./...
        working-directory: ${{ matrix.module }}

      # THE SOAK AT FULL LENGTH, UNRACED, and this step is the other half of a
      # deliberate split rather than a duplicate run.
      #
      # TestTwoThousandTurnSoakStaysWithinItsBounds drives 2000 exchanges through
      # Update in ONE goroutine. There is no concurrency in it for the race
      # detector to examine, and instrumenting it costs 9x: 29.9s becomes 270.9s
      # locally and 7m38s on this runner, which is how the clients/tui package
      # first hit `go test`'s 10-minute timeout.
      #
      # So the raced run above executes a reduced 400 exchanges -- still 150 past
      # the point the turn ceiling engages, and the test FAILS if nothing was
      # evicted -- and this step runs the full 2000 without the detector, in ~40s.
      # Both lengths run in CI on every push. Neither is a silent skip, and the
      # 2000-turn figure quoted in docs/TUI_PRODUCTION_READINESS_2026-09-04.md is
      # reproduced here rather than only on a developer machine.
      - name: Transcript soak at full length (unraced)
        if: matrix.module == 'clients/tui'
        run: go test -run TestTwoThousandTurnSoakStaysWithinItsBounds -count=1 -v .
        working-directory: ${{ matrix.module }}

      # Deliberately a SEPARATE step from Test, and deliberately without -race.
      # Separate, because "tests failed" and "coverage regressed" are different
      # problems and a single red step would not say which. Without -race,
      # because the race detector is already gated above and instrumenting twice
      # costs time without moving a coverage number.
      #
      # No working-directory: the script runs from the repo root and takes the
      # module as an argument, since the floors it reads are repo-wide.
      - name: Coverage ratchet
        run: ./scripts/coverage-ratchet.sh ${{ matrix.module }}

  lint:
    # Static analysis: staticcheck, ineffassign, bodyclose as HARD gates (what
    # each one gates is documented in scripts/lint.sh), plus errcheck as a
    # RATCHET rather than a gate -- see the ceiling step below and debt item (j).
    #
    # Same explicit module matrix as the other Go jobs, for the same reason: there
    # is no root module, so a root-level ./... does not work.
    name: lint (${{ matrix.module }})
    # A same-repo PR would otherwise run twice: once for the branch push and
    # once for the merge result. Forks are the reason pull_request exists at
    # all, and this repo is private with none -- so skip the PR copy when it
    # comes from this very repository. Halves the Actions minutes a PR costs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        module: [daemon, editapply, proxy, helper, protocol, clients/tui]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      # PINNED, and with a toolchain FLOOR, because @latest on four tools was the
      # one unpinned surface left in a repo that pins its actions to commit SHAs
      # and its Go toolchain to a single version in seven places. It broke on
      # 2026-09-09 exactly the way unpinned surfaces break: upstream moved and
      # nothing here changed. Six lint jobs went red, the `Lint` step never ran,
      # and the job name said "lint" -- which is how a gate gets waived.
      #
      # WHAT ACTUALLY BROKE, since the previous comment here described a
      # different and now-wrong mechanism ("its x/sys dependency needs >= 1.25"):
      # bodyclose imports golang.org/x/sys/execabs and does NOT list x/sys in its
      # go.mod, so `go install` resolves that MISSING package at @latest, lands
      # on x/sys v0.48.0, and that requires go >= 1.26.
      #
      # Pinning bodyclose alone cannot fix it -- a missing import is resolved at
      # latest whatever version of bodyclose is named -- so the toolchain floor
      # is doing the load-bearing work and the pins stop the OTHER three drifting.
      #
      # go1.26.0+auto rather than a hard go1.26.8: a floor that still upgrades if
      # a future dependency needs more, so this does not become a second constant
      # that goes stale. Measured 2026-09-09: bare install, GOTOOLCHAIN=auto, and
      # the GOTOOLCHAIN=go1.25.13 form that scripts/lint.sh used to print ALL
      # fail; go1.26.0+auto and an explicit go1.26.8 both install cleanly.
      #
      # Building a linter with a newer toolchain does not touch the product: these
      # are separate analysis binaries, and go-toolchain-pinned.sh gates go.mod
      # and go.work, which this does not change.
      # ONE LIST, THREE READERS. The versions live in scripts/tool-pins.txt and
      # are installed by scripts/install-tools.sh, which scripts/lint.sh also
      # reads to CHECK the binary a developer actually has. Spelling `go install`
      # lines out here again would recreate the split that let CI pin one version
      # while a laptop linted with another -- staticcheck v0.8.1 against v0.7.0
      # on 2026-09-09, with the gate reporting green.
      - name: Install linters
        run: ./scripts/install-tools.sh

      - name: Lint
        run: ./scripts/lint.sh ${{ matrix.module }}

      # errcheck is NOT a hard gate -- see debt item (j), which deferred adoption
      # because turning it green means ~170 `_ =` assignments or an arbitrary
      # exclusion list. It IS a ratchet: the existing count is grandfathered and
      # may not grow. The deferral previously had no mechanism, and the count
      # drifted 157 -> 170 in two weeks.
      - name: Unchecked-error ceiling
        run: ./scripts/errcheck-ceiling.sh ${{ matrix.module }}

  fuzz:
    # EIGHTEEN targets as of 2026-09-05, over FOUR trust boundaries: the
    # request/SSE parsers in proxy (7); the edit-block parser, unified-diff
    # reader and matcher in editapply (4); agent mode's readers in daemon (4);
    # and the terminal client's escape sanitizer and incremental renderer in
    # clients/tui (3).
    #
    # THE LIST IN scripts/fuzz.sh IS AUTHORITATIVE. This comment is not, and it
    # has now drifted twice: it said "Nine" while the array held thirteen, and
    # then "Fifteen over three boundaries" while the array held eighteen over
    # four -- omitting clients/tui entirely, which is the boundary this repo
    # most recently added. Corrected 2026-09-05. Nothing gates a comment, so if
    # this number and TARGETS ever disagree again, believe TARGETS.
    # See scripts/fuzz.sh for what each target asserts.
    #
    # 30s per target is a REGRESSION gate, not a search: it re-walks the corpus
    # and shallow mutations on every PR. Finding something new wants minutes to
    # hours, via FUZZTIME locally.
    #
    # One job rather than a per-module matrix: the whole run is a few minutes,
    # and a single job keeps the seed-corpus story in one place.
    name: fuzz
    # A same-repo PR would otherwise run twice: once for the branch push and
    # once for the merge result. Forks are the reason pull_request exists at
    # all, and this repo is private with none -- so skip the PR copy when it
    # comes from this very repository. Halves the Actions minutes a PR costs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Fuzz (30s per target)
        run: ./scripts/fuzz.sh

  cross:
    # TRACK C3. Everything Windows in this repo -- the named-pipe transport, the
    # SID-based peer authentication, the platform seams for openNoFollow and the
    # process group -- was written, cross-vetted, and NEVER EXECUTED ON HARDWARE.
    # Same for peercred_darwin.go, which has never run anywhere at all. Those
    # facts are labelled NOT RUN throughout the source; this job is what turns
    # the label into evidence.
    #
    # BUILD, VET AND TEST. This said "BUILD AND VET ONLY, on purpose" until
    # 2026-08-07, by which point the job had been running `go test ./...` for
    # several commits -- a comment describing an earlier intent as though it were
    # the current behaviour, which is worse than no comment because it is
    # believed.
    #
    # The staged plan it described was real and it worked, so the reasoning is
    # kept rather than deleted: "Windows and macOS join CI as build-only first,
    # then full test." A first contact that runs the whole suite on two unproven
    # platforms produces a wall of red in which the real porting defects are
    # indistinguishable from environment noise. Compile + vet answered one
    # question cleanly -- does the code the seams produce actually typecheck on
    # the platform it claims? -- and that answer was worth having first.
    #
    # STAGE 1 IS DONE. Run #40 was the first honest Windows test run: 58 failures
    # became 13, and those 13 resolved to 6 root causes, 5 of which were real
    # product defects rather than test artefacts. Testing is now the point of
    # this job, and turning it back off would give up the only signal that has
    # ever found a Windows bug here.
    #
    # Modules chosen for what they mean, not for coverage: daemon and protocol
    # hold every platform seam, editapply holds the confinement gates whose
    # Windows path semantics are still unverified (junctions, ADS, 8.3 names),
    # and clients/tui is what a user actually runs. helper is excluded because it
    # is cgo against onnxruntime and needs a toolchain story of its own; proxy is
    # excluded because it deploys to Linux and never ships to a desktop.
    name: cross (${{ matrix.os }}, ${{ matrix.module }})
    if: >-
      vars.HOSTED_RUNNERS_DISABLED != 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # WINDOWS EVERY PUSH, MACOS ONLY WHERE IT EARNS ITS PRICE.
        #
        # Actions bills wall-clock per job, rounded up to the minute, times an
        # OS rate: Linux 1x, Windows 2x, macOS 10x. Measured on run 31083299803,
        # one full run cost 86 billable minutes -- and 40 of those were four
        # macOS jobs doing four minutes of real work, more than all 22 Ubuntu
        # jobs combined. A private repo on the free plan gets 2,000 a month, so
        # that is ~23 pushes.
        #
        # Gated on `main` rather than on pull_request, deliberately: this repo is
        # merged with `git merge --ff-only` and pushed straight to main, so a
        # PR-only gate would mean macOS effectively never ran. Branch pushes get
        # Windows; whatever lands on the mainline gets both. workflow_dispatch is
        # the manual escape hatch for testing macOS from a branch.
        #
        # Shrinking the MATRIX rather than adding a job-level `if`, because the
        # matrix context is not available to jobs.<id>.if -- an `if` referencing
        # matrix.os silently evaluates against an empty context. Here the macOS
        # runner is never requested at all, which is what actually saves money.
        # ONE OS NOW. This used to expand to include macos-latest on main and on
        # workflow_dispatch; darwin-arm64 left the target set on 2026-09-17 and
        # the runner went with it. A literal list rather than a fromJSON
        # expression, because there is no longer a condition to evaluate and an
        # expression that always returns the same value is a place for a future
        # reader to look for logic that is not there.
        os: [windows-latest]
        # helper IS HERE NOW, and it is the point of this change.
        #
        # It was excluded because it is cgo against onnxruntime, so its tests had
        # never run on any platform but Linux -- and that exclusion hid a defect
        # that made local retrieval impossible on Windows for as long as Windows
        # has been supported (helper/main.go asked for a Unix socket; Windows
        # rejects that outright). The daemon's Windows tests went green
        # throughout, against a fixture that dialled a different transport than
        # production did.
        #
        # cgo works here because this builds NATIVELY on windows-latest rather
        # than cross-compiling -- the same reason release.yml's binaries job has
        # always been able to build it. What it still cannot exercise is the ONNX
        # runtime itself: helper/embedleak_test.go skips when the model is not
        # cached, which on a CI runner is most of the time. helper's platform
        # coverage banner says so in its own log.
        #
        # proxy is still absent, deliberately: it ships only as a linux/amd64
        # container image, so no Windows artifact of it exists to defend.
        module: [daemon, protocol, editapply, clients/tui, helper]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Build
        run: go build ./...
        working-directory: ${{ matrix.module }}

      # Vet compiles the TEST files too, which build alone does not. That is the
      # half that catches a _test.go using a syscall the platform lacks -- the
      # exact break a GOOS=windows go vet found locally in four test files.
      - name: Vet
        run: go vet ./...
        working-directory: ${{ matrix.module }}

      # C3-NEXT: the step that turns a large block of NOT RUN into evidence.
      #
      # Until now this job answered "does it compile there?", which was the right
      # first question and is now answered. It never answered "does it WORK
      # there?" -- and the named-pipe transport, the SID-based peer
      # authentication, the openNoFollow and process-group seams, and every line
      # of peercred_darwin.go have therefore never executed on any machine,
      # anywhere. They are labelled NOT RUN throughout the source precisely
      # because nobody could claim otherwise.
      #
      # EXPECT THIS TO GO RED, and expect that to be the point. pathhazard.go
      # refuses junctions, ADS, 8.3 aliases and trailing-dot names on reasoning
      # about Win32 that has never met Win32, and filepath.EvalSymlinks versus
      # junctions is recorded as the top UNKNOWN security risk in the plan. The
      # last three CI reds -- the extension test, the docker image, the innerHTML
      # sink -- were each a real defect found the moment the code met an
      # environment that could run it.
      #
      # NO -race, unlike the Ubuntu job, and that is a deliberate narrowing
      # rather than an oversight. The race detector roughly doubles runtime and
      # is the gate this project's concurrency work already passes on Linux;
      # paying 2x on Windows to re-ask a question that is not platform-specific
      # would buy noise. Platform-specific FAILURES are what this job is for.
      - name: Test
        run: go test -count=1 ./...
        working-directory: ${{ matrix.module }}

      # THE POINT OF THE PREVIOUS STEP'S SILENCE, MADE AUDIBLE.
      #
      # Five of clients/tui's test files are `//go:build linux`, because
      # allocating a pty is per-kernel. On this runner they are not compiled, the
      # step above prints `ok`, and nothing says that the terminal-restore path,
      # the signal handling, the real-binary sanitizer wiring and the
      # render-determinism matrix were never exercised here.
      #
      # TestPlatformCoverageIsStated names them -- but through t.Logf, which
      # `go test` swallows without -v. Run explicitly, with -v, so the report
      # lands in the log of the platform that is missing them. One second.
      # EVERY module in the matrix, not just clients/tui. Until 2026-09-09 only
      # clients/tui had this banner, so daemon (-2 test files on Windows),
      # editapply (-1) and protocol (-3) lost coverage in silence and the step
      # above printed `ok`. Skips must never read as passes.
      - name: What this platform does not run
        run: go test -run TestPlatformCoverageIsStated -v -count=1 .
        working-directory: ${{ matrix.module }}

  # ---------------------------------------------------------------------------
  # THE macOS JOBS ARE GONE, and this paragraph is what is left of them.
  #
  # REMOVED 2026-09-17 with darwin-arm64 itself. There was a `macos-tui` job
  # here -- named "macos (clients/tui, every push)" while its own condition was
  # `github.ref != 'refs/heads/main'`, so it never once ran on the mainline --
  # and `cross` expanded to include macos-latest on main and on dispatch.
  #
  # They tested a platform the release no longer builds. scripts/release-targets.txt
  # carries the decision and what would reverse it; docs/RESIDUAL_RISKS.md R1.15
  # carries the founder ruling it finishes.
  #
  # WHAT THIS BUYS, measured against the figures the removed comment carried: a
  # main-branch run was 162 billable minutes with the four macOS `cross` jobs and
  # 92 without. macOS bills at 10x, and that multiplier is now spent on `helper`
  # and on Windows instead -- the platform that IS shipping.
  #
  # protocol/peerauth_darwin.go and its test are deliberately KEPT. They are
  # correct Go code costing nothing to carry, and deleting them would make a
  # future return expensive for no present gain.
  # ---------------------------------------------------------------------------


  govulncheck:
    name: govulncheck (${{ matrix.module }})
    # A same-repo PR would otherwise run twice: once for the branch push and
    # once for the merge result. Forks are the reason pull_request exists at
    # all, and this repo is private with none -- so skip the PR copy when it
    # comes from this very repository. Halves the Actions minutes a PR costs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        module: [daemon, editapply, proxy, helper, protocol, clients/tui]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      # PINNED, from the same list as every other tool. This was the last
      # @latest in CI, and @latest is exactly how the six lint jobs died on
      # 2026-09-09: upstream moved, nothing here changed, and the install step
      # failed before the tool ever ran.
      - name: Install govulncheck
        run: ./scripts/install-tools.sh
      - name: Scan
        run: govulncheck ./...
        working-directory: ${{ matrix.module }}

  extension:
    # The VS Code tests run in a real Extension Development Host, which needs a
    # display; xvfb-run supplies one. Confirmed working -- this is the same
    # invocation used locally.
    name: vscode extension
    # A same-repo PR would otherwise run twice: once for the branch push and
    # once for the merge result. Forks are the reason pull_request exists at
    # all, and this repo is private with none -- so skip the PR copy when it
    # comes from this very repository. Halves the Actions minutes a PR costs.
    if: >-
      vars.HOSTED_RUNNERS_DISABLED != 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # MAJOR ONLY, DELIBERATELY, and the reasoning differs from Go's.
          #
          # Go's patch version had to be pinned because it changed dependency
          # RESOLUTION and which stdlib govulncheck scanned. Node's does not:
          # `npm ci` installs from package-lock.json, which pins the entire tree
          # including typescript, so the compiler and every gate input are fixed
          # regardless of which 20.x runs them. Pinning the patch here would buy
          # reproducibility that the lockfile already provides, and cost a manual
          # bump for every Node security release.
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      # Go, in the NODE job, and not a mistake. package.json's `compile` script
      # is `npm run build:daemon && tsc -p ./`, and build:daemon shells out to
      # `go build ./daemon` to bundle the binary into the extension. So this job
      # needs a Go toolchain despite being about TypeScript.
      #
      # It did not have one, and the job failed on its first ever run with
      # `sh: 1: go: not found`. The bundling step arrived with the daemon-
      # supervision work and was never exercised, because CI only ran on main
      # and that work has never been on main.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Install
        run: npm ci
        working-directory: clients/vscode
      # The packaging gate's own self-test, BEFORE the suite. It costs
      # milliseconds and it is the only thing that proves verify-vsix.js can
      # still refuse an archive -- which matters because on 2026-09-02 that gate
      # was found to have twelve patterns, none of them about a credential, and
      # a planted .env was confirmed by execution to reach `vsce ls`.
      - name: Packaging gate self-test
        run: npm run verify:vsix:selftest
        working-directory: clients/vscode

      # media/main.js is 28% of this extension and renders the security
      # decisions; nothing checked it until 2026-09-02, and switching checkJs on
      # immediately found a live ReferenceError in the edit-rejection renderer.
      - name: Webview static analysis
        run: npm run check:webview
        working-directory: clients/vscode

      # The install path, which nothing checked. The EDH suite below covers the
      # daemon seam but needs a display, and the two halves of the first-run
      # defect that live in TypeScript and JSON had no instrument at all: a
      # spawn with no env, and a setting that was never contributed. Plain node,
      # like the webview check above, so it runs before the expensive host boot.
      - name: Install-path static analysis
        run: npm run check:installpath
        working-directory: clients/vscode

      - name: Compile (tsc)
        run: npm run compile
        working-directory: clients/vscode
      - name: Test (Extension Development Host)
        run: xvfb-run -a npm test
        working-directory: clients/vscode

  proxy-image:
    # Builds the proxy Docker image exactly as Railway does (same Dockerfile,
    # same build context) so a broken build context — e.g. a Dockerfile that
    # fails to COPY a needed .go file — is caught here instead of at deploy.
    if: vars.HOSTED_RUNNERS_DISABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build proxy image
        run: docker build -t mochiii-proxy:ci ./proxy

  eval:
    # NOT per-PR. The -tags eval suite downloads a real embedding model and
    # indexes this whole repository once per test; running it on every push would
    # make the gate slow enough that people route around it, which is the failure
    # mode this whole pipeline exists to fix. On a schedule it still catches
    # retrieval-quality drift within a week.
    #
    # The "~148s" this comment used to claim was one test's local time, quoted as
    # the suite's. The three tests together exceeded `go test`'s DEFAULT 10-minute
    # timeout on this runner and the job died with `panic: test timed out after
    # 10m0s` -- in run 31168478415 and again in 31174599384, both times with the
    # panic sitting underneath a separate, real failure that was easier to see. A
    # job that is red for two reasons at once teaches you about one of them.
    #
    # -timeout is therefore explicit below. Nothing was hanging: when the alarm
    # fired, TestTokenEfficiencyEval had been running 3m25s of legitimate work.
    name: retrieval eval (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      # 2026-08-07: this job had been RED, and the cause was the harness, not
      # retrieval. TestRerankEvalRetrievalRanking's ground truth was a
      # hand-written list of file:startLine-endLine chunk IDs, so every edit to a
      # named file shifted the ranges out from under it -- five of nine queries
      # were reporting STALE EXPECTATION, one of them because the transport seam
      # had moved net.Listen("unix") into another module entirely.
      #
      # The expectation is now DERIVED from the index each run (declared files
      # and code anchors in, chunk IDs out), so it cannot go stale. Measured
      # 4/9 red -> 8/9 green with no retrieval code changed. See
      # resolveExactChunks in daemon/rerank_eval_test.go.
      #
      # Scoped to the three eval tests that are GREEN, deliberately.
      #
      # TestEditShapedRetrievalEval is excluded because its HARNESS cannot build
      # its own fixtures -- not, as this comment once said, because retrieval
      # scores 0/4. Three of its four cases reconstruct a pre-fix tree by
      # reverting the fix commit, and those reverts now conflict (the commits are
      # 178-221 commits behind HEAD), so those cases never issue a query at all.
      # See BACKLOG.md item (b), corrected 2026-07-31.
      #
      # BUT THE "0/4" IS NOT ENTIRELY A SETUP FAILURE, which this comment used to
      # imply and which would lead someone to read the number as carrying no
      # retrieval signal at all. Measured 2026-08-08 at 23550e4 (see
      # docs/RETRIEVAL_EVAL_CHECKPOINT_2026-08-08.md): the fourth case,
      # helperproc-env-allowlist, reverts cleanly, runs for 131s, issues a REAL
      # query -- and misses, at rank #109 of the full ordering (#189
      # semantic-only). It is the one case here that measures anything, and what
      # it measures is a miss. So 0/4 = three cases that never ran, plus one that
      # ran and genuinely failed. Do not quote the 0/4 as "no signal".
      #
      # Including it would leave this job permanently red, and a job that is
      # always red is a job nobody reads -- the exact failure this pipeline
      # exists to fix.
      #
      # UPDATE 2026-08-28. The harness WAS fixed -- it now checks out
      # fixCommit~1 and restores the fixed file on top, so all four cases
      # materialise instead of three aborting on a conflict, and grading derives
      # its ground truth from the fix diff instead of hand-written chunk IDs.
      # The exclusion stands anyway, and the objection this comment used to
      # state as a prohibition is the reason why: a 200-commit-old parent tree
      # is not the corpus the product retrieves over, so the number describes a
      # repository that no longer exists. It is a historical benchmark now, and
      # daemon/edit_eval_test.go's header says so at the top.
      #
      # The question it existed to ask -- can retrieval find the code a fix must
      # touch -- is asked against CURRENT code by the expanded locate eval, and
      # that one does gate: .github/workflows/retrieval-eval.yml runs it on
      # every PR that touches the retrieval path.
      # THE DATUM THAT WAS MISSING WHEN THIS JOB WENT 2.63x SLOWER. Three eval
      # runs on 2026-08-30 carried the same `ubuntu-latest` label and landed on
      # three different runner instances, one of which took 2220s for work the
      # other did in 843s. Whether that instance had fewer cores or a slower
      # host could not be answered afterwards, because nothing had recorded
      # what the machine was. Four lines, once per run, and the next
      # investigation starts with the answer instead of a hypothesis.
      - name: Record what machine this ran on
        run: |
          echo "runner: $RUNNER_NAME  os: $RUNNER_OS  arch: $RUNNER_ARCH"
          echo "nproc: $(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
          free -g | head -2

      - name: Run gated eval suite (green subset -- see comment)
        # -v AND -count=1 ARE LOAD-BEARING HERE, not tidiness. See below.
        #
        # 60m SINCE 2026-08-30, and the reason has now been established rather
        # than guessed. Two earlier explanations were written into this file as
        # fact and both were wrong, so the evidence is recorded with the answer.
        #
        # THE MEASUREMENTS. Same step, same github-hosted ubuntu-latest, same
        # runner image (ubuntu-24.04 20260823.283.1) and region:
        #
        #   budget 24000 (run 33305669593)   843s,   all three tests completed
        #   budget 32000 (run 33309133076)   killed by the 30m alarm
        #   budget 32000 (run 33311677642)   2220s,  all three tests completed
        #
        # 2.63x, and the window between those commits contains exactly ONE
        # non-comment code change: defaultContextBudgetChars, 24000 -> 32000.
        # Which is what made "the budget costs 2.58x" look like a controlled
        # result. It is not the cause.
        #
        # WHAT ACTUALLY ESTABLISHED IT was the goroutine dump from the run that
        # timed out. At the 30-minute alarm TestTokenEfficiencyEval had been
        # running 11m43s and was sitting in embedder.Embed, at
        # token_efficiency_eval_test.go:202 -- INSIDE THE INDEX BUILD. That
        # phase embeds ~4,700 chunks and takes no budget input whatsoever: the
        # budget enters the eval at exactly one call, truncateToBudget, over at
        # most a few dozen chunks per query. There is no mechanism in this code
        # by which a constant can cost 1,376 seconds, and the profile says the
        # time did not go anywhere near it.
        #
        # THE CONTROLLED TEST, run locally on one machine, one worktree, back to
        # back, with that constant as the only difference:
        #
        #                        24000      32000     ratio
        #   rerank eval          419.84s    469.96s   1.119x
        #   token-efficiency     446.27s    472.30s   1.058x
        #   package total        866.4s     942.6s    1.088x
        #   max RSS              3228800K   3226216K  1.000x
        #
        # THE BUDGET COSTS 8.8%. Not 158%. It is a real cost and it is
        # proportionate to what it does -- more chunks survive truncateToBudget,
        # so more get rendered and scanned. Identical peak memory also rules out
        # the obvious second story, that a bigger budget pushes a small runner
        # into swap.
        #
        # So of CI's observed 2.63x, the budget accounts for 1.09x and the
        # remaining 2.4x is the runner. Three eval runs that day carried the
        # same `ubuntu-latest` label and landed on three different instances
        # (1000000122, 1000000172, 1000000238); no repo variable overrides the
        # label. Which is as far as this can be taken from outside GitHub, so it
        # is left there rather than given a third confident explanation.
        #
        # And the cross-check that rules out the hardware: CI at budget 24000
        # ran that same test in 413.42s, against 419.84s on the developer
        # laptop. A healthy runner and this laptop are the same speed to within
        # 2%. The 2.63x is one runner instance being slow at CPU-bound ONNX
        # inference for an hour -- the model DOWNLOAD, 32MB of HTTPS with no
        # repo code in it at all, was ~3x slower on that same instance.
        #
        # SO THE REAL PROBLEM WAS NEVER THE BUDGET. It is that this job spends
        # ~95% of its wall clock embedding, and until 2026-08-30 it embedded the
        # whole repository TWICE per run for byte-identical vectors. That is
        # what daemon/evalcorpus_test.go fixes. 60m stays: the observed worst
        # case was 37m43s and these runners vary by better than 2x, so a tighter
        # alarm flakes. A timeout only bounds a hang; a failing test still fails.
        #
        # WHY -v. THIS IS THE DEFECT THAT MADE ALL OF THE ABOVE ARCHAEOLOGY.
        # `go test` discards a passing package's output. The 37m43s run
        # therefore emitted, in 38 minutes, one line: "ok mochiii/daemon
        # 2219.578s". Which test, which phase, how many chunks -- none of it
        # survived, and the only reason the cause is known is that a DIFFERENT
        # run crashed and dumped a stack. A job whose whole purpose is to
        # measure must not throw its measurements away when it passes.
        # retrieval-eval.yml already passed -v; this one did not.
        #
        # WHY -count=1. Without it, `go test` may serve a CACHED result, and
        # setup-go restores GOCACHE across runs. A cached pass prints "ok" and
        # measures nothing -- a scheduled drift detector that silently stops
        # detecting drift. retrieval-eval.yml already passed it.
        run: go test -tags eval -count=1 -v -timeout 60m -run 'TestEvalRetrievalQuality|TestRerankEvalRetrievalRanking|TestTokenEfficiencyEval|TestFirstEmbedBatchFitsItsDeadline|TestEmbeddingIsDeterministic|TestEmbeddingVariesWithThreadCount' ./...
        working-directory: daemon
