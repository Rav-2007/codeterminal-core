name: build

on:
  # EVERY branch, not just main.
  #
  # This used to be `branches: [main]`, which meant a feature branch could be
  # pushed and receive no verification at all -- the branch carrying 13 commits
  # of security work sat on the remote with CI having never once looked at it.
  # Waiting for a PR to find out whether the code compiles inverts the order you
  # want: the point of CI is to know BEFORE you ask someone to merge it.
  push:
    branches: ["**"]
  # Kept, and deliberately narrower. A pull_request run tests the MERGE RESULT
  # (branch + current main), which is a different question from the branch head
  # the push run tested, and the only one that catches "fine alone, broken
  # against what landed meanwhile".
  pull_request:
    branches: [main]
  # The eval job below is schedule/dispatch-only; these triggers exist so it has
  # something to hang off. Everything else runs per-push and per-PR.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Cancel a run that a newer push to the same ref has already superseded. Pushing
# three times in a minute should cost one run's minutes, not three -- this repo
# is private on a free plan, where Actions minutes are a finite monthly budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# There is no root Go module -- only go.work -- so `./...` from the repo root
# fails outright ("directory prefix . does not contain modules listed in
# go.work"). Every Go step below therefore names its module explicitly. Do not
# "simplify" these to a root-level ./... ; it does not work.
env:
  GO_VERSION: "1.25.x"

jobs:
  go:
    # 584 Go tests, gofmt, and vet existed in this repo and gated nothing: the
    # entire pipeline was one docker build. Both regressions in the 2026-07-30
    # launch-gate review shipped past a green LOCAL suite, because a suite nobody
    # is required to run is a suite that drifts. This job makes the suite run on
    # every push and PR to main.
    #
    # It does NOT yet BLOCK anything, and that distinction matters. Required
    # status checks need branch protection, and branch protection is unavailable
    # on this repo: it is private on a free plan, so
    # `GET /repos/:owner/:repo/branches/main/protection` answers
    # `403 Upgrade to GitHub Pro or make this repository public` (checked
    # 2026-07-30). Until the repo goes public or onto Pro, a red run is a signal
    # someone has to read, not a merge that cannot happen. Making it enforceable
    # is tracked in BACKLOG.md.
    name: go (${{ matrix.module }})
    # A same-repo PR would otherwise run twice: once for the branch push and
    # once for the merge result. Forks are the reason pull_request exists at
    # all, and this repo is private with none -- so skip the PR copy when it
    # comes from this very repository. Halves the Actions minutes a PR costs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [daemon, editapply, proxy, helper, protocol, clients/tui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      # The sandbox under test. Without bubblewrap installed, WrapCommand falls
      # back, the tests that EXECUTE a sandbox skip themselves with NOT RUN, and
      # daemon/mcp coverage drops from ~91% to 89.2% -- straight through its
      # 91.0 floor. Measured, not guessed: that is what turned this job red on
      # its first ever run.
      #
      # Installing it here is the right fix rather than a workaround. A
      # developer's machine may forbid user namespaces (Ubuntu 24.04+ desktops
      # do by default), so CI is the one place the confinement claims can be
      # verified on every commit. That is the whole point of the job.
      #
      # The probe is deliberate: apt succeeding proves the binary is PRESENT,
      # which this campaign has twice mistaken for it being USABLE. If it cannot
      # create a namespace, say so loudly here rather than let it surface later
      # as an unexplained coverage drop.
      - name: Install bubblewrap
        if: matrix.module == 'daemon'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          bwrap --version
          if bwrap --ro-bind / / --unshare-user --die-with-parent /bin/true; then
            echo "::notice::bwrap CAN create a user namespace - sandbox tests will execute"
          else
            echo "::warning::bwrap CANNOT create a user namespace - sandbox tests will skip and coverage will drop"
          fi

      - name: Build
        run: go build ./...
        working-directory: ${{ matrix.module }}

      # gofmt -l prints offending files and exits 0, so the output is the signal.
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...
        working-directory: ${{ matrix.module }}

      # -race, not a bare `go test`: this repo's concurrency work (the Gate 6
      # apply/undo locking in particular) is only defended by the race detector.
      - name: Test
        run: go test -race ./...
        working-directory: ${{ matrix.module }}

      # Deliberately a SEPARATE step from Test, and deliberately without -race.
      # Separate, because "tests failed" and "coverage regressed" are different
      # problems and a single red step would not say which. Without -race,
      # because the race detector is already gated above and instrumenting twice
      # costs time without moving a coverage number.
      #
      # No working-directory: the script runs from the repo root and takes the
      # module as an argument, since the floors it reads are repo-wide.
      - name: Coverage ratchet
        run: ./scripts/coverage-ratchet.sh ${{ matrix.module }}

  lint:
    # Static analysis: staticcheck, ineffassign, bodyclose as HARD gates (what
    # each one gates is documented in scripts/lint.sh), plus errcheck as a
    # RATCHET rather than a gate -- see the ceiling step below and debt item (j).
    #
    # Same explicit module matrix as the other Go jobs, for the same reason: there
    # is no root module, so a root-level ./... does not work.
    name: lint (${{ matrix.module }})
    # A same-repo PR would otherwise run twice: once for the branch push and
    # once for the merge result. Forks are the reason pull_request exists at
    # all, and this repo is private with none -- so skip the PR copy when it
    # comes from this very repository. Halves the Actions minutes a PR costs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [daemon, editapply, proxy, helper, protocol, clients/tui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      # bodyclose builds with the BASE toolchain and its x/sys dependency needs
      # >= 1.25, so this step depends on setup-go having installed 1.25.x above.
      # On an older base it fails to install at all -- see scripts/lint.sh.
      - name: Install linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/gordonklaus/ineffassign@latest
          go install github.com/timakin/bodyclose@latest
          go install github.com/kisielk/errcheck@latest

      - name: Lint
        run: ./scripts/lint.sh ${{ matrix.module }}

      # errcheck is NOT a hard gate -- see debt item (j), which deferred adoption
      # because turning it green means ~170 `_ =` assignments or an arbitrary
      # exclusion list. It IS a ratchet: the existing count is grandfathered and
      # may not grow. The deferral previously had no mechanism, and the count
      # drifted 157 -> 170 in two weeks.
      - name: Unchecked-error ceiling
        run: ./scripts/errcheck-ceiling.sh ${{ matrix.module }}

  fuzz:
    # Nine targets over the two trust boundaries: the request/SSE parsers in
    # proxy, and the edit-block parser and matcher in editapply. See
    # scripts/fuzz.sh for what each one asserts.
    #
    # 30s per target is a REGRESSION gate, not a search: it re-walks the corpus
    # and shallow mutations on every PR. Finding something new wants minutes to
    # hours, via FUZZTIME locally.
    #
    # One job rather than a per-module matrix: the whole run is a few minutes,
    # and a single job keeps the seed-corpus story in one place.
    name: fuzz
    # A same-repo PR would otherwise run twice: once for the branch push and
    # once for the merge result. Forks are the reason pull_request exists at
    # all, and this repo is private with none -- so skip the PR copy when it
    # comes from this very repository. Halves the Actions minutes a PR costs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Fuzz (30s per target)
        run: ./scripts/fuzz.sh

  cross:
    # TRACK C3. Everything Windows in this repo -- the named-pipe transport, the
    # SID-based peer authentication, the platform seams for openNoFollow and the
    # process group -- was written, cross-vetted, and NEVER EXECUTED ON HARDWARE.
    # Same for peercred_darwin.go, which has never run anywhere at all. Those
    # facts are labelled NOT RUN throughout the source; this job is what turns
    # the label into evidence.
    #
    # BUILD AND VET ONLY, on purpose, and that ordering is from the launch plan:
    # "Windows and macOS join CI as build-only first, then full test." A first
    # contact that runs the whole suite on two unproven platforms produces a wall
    # of red in which the real porting defects are indistinguishable from
    # environment noise. Compile + vet answers one question cleanly -- does the
    # code the seams produce actually typecheck on the platform it claims? --
    # and the answer is worth having before the harder one is asked.
    #
    # Modules chosen for what they mean, not for coverage: daemon and protocol
    # hold every platform seam, editapply holds the confinement gates whose
    # Windows path semantics are still unverified (junctions, ADS, 8.3 names),
    # and clients/tui is what a user actually runs. helper is excluded because it
    # is cgo against onnxruntime and needs a toolchain story of its own; proxy is
    # excluded because it deploys to Linux and never ships to a desktop.
    name: cross (${{ matrix.os }}, ${{ matrix.module }})
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        module: [daemon, protocol, editapply, clients/tui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Build
        run: go build ./...
        working-directory: ${{ matrix.module }}

      # Vet compiles the TEST files too, which build alone does not. That is the
      # half that catches a _test.go using a syscall the platform lacks -- the
      # exact break a GOOS=windows go vet found locally in four test files.
      - name: Vet
        run: go vet ./...
        working-directory: ${{ matrix.module }}

  govulncheck:
    name: govulncheck (${{ matrix.module }})
    # A same-repo PR would otherwise run twice: once for the branch push and
    # once for the merge result. Forks are the reason pull_request exists at
    # all, and this repo is private with none -- so skip the PR copy when it
    # comes from this very repository. Halves the Actions minutes a PR costs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [daemon, editapply, proxy, helper, protocol, clients/tui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan
        run: govulncheck ./...
        working-directory: ${{ matrix.module }}

  extension:
    # The VS Code tests run in a real Extension Development Host, which needs a
    # display; xvfb-run supplies one. Confirmed working -- this is the same
    # invocation used locally.
    name: vscode extension
    # A same-repo PR would otherwise run twice: once for the branch push and
    # once for the merge result. Forks are the reason pull_request exists at
    # all, and this repo is private with none -- so skip the PR copy when it
    # comes from this very repository. Halves the Actions minutes a PR costs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      # Go, in the NODE job, and not a mistake. package.json's `compile` script
      # is `npm run build:daemon && tsc -p ./`, and build:daemon shells out to
      # `go build ./daemon` to bundle the binary into the extension. So this job
      # needs a Go toolchain despite being about TypeScript.
      #
      # It did not have one, and the job failed on its first ever run with
      # `sh: 1: go: not found`. The bundling step arrived with the daemon-
      # supervision work and was never exercised, because CI only ran on main
      # and that work has never been on main.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Install
        run: npm ci
        working-directory: clients/vscode
      - name: Compile (tsc)
        run: npm run compile
        working-directory: clients/vscode
      - name: Test (Extension Development Host)
        run: xvfb-run -a npm test
        working-directory: clients/vscode

  proxy-image:
    # Builds the proxy Docker image exactly as Railway does (same Dockerfile,
    # same build context) so a broken build context — e.g. a Dockerfile that
    # fails to COPY a needed .go file — is caught here instead of at deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build proxy image
        run: docker build -t codeterminal-proxy:ci ./proxy

  eval:
    # NOT per-PR. The -tags eval suite downloads a real embedding model and takes
    # ~148s; running it on every push would make the gate slow enough that people
    # route around it, which is the failure mode this whole pipeline exists to
    # fix. On a schedule it still catches retrieval-quality drift within a week.
    name: retrieval eval (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      # Scoped to the three eval tests that are GREEN, deliberately.
      #
      # TestEditShapedRetrievalEval is excluded because its HARNESS cannot build
      # its own fixtures -- not, as this comment previously said, because
      # retrieval scores 0/4. Three of its four cases reconstruct a pre-fix tree
      # by reverting the fix commit, and those reverts now conflict (the commits
      # are 178-221 commits behind HEAD), so those cases never issue a query at
      # all. The "0/4" it prints is a setup failure wearing a recall label. See
      # BACKLOG.md item (b), corrected 2026-07-31.
      #
      # Including it would leave this job permanently red, and a job that is
      # always red is a job nobody reads -- the exact failure this pipeline
      # exists to fix.
      #
      # Do NOT "fix" this by checking out the fix commit's parent: restoring
      # just the pre-fix source files was probed and does not compile against
      # today's tree, and restoring the whole parent tree measures retrieval
      # over 200-commit-old code. Reconstructing a historical bug state in a
      # moving tree expires by design; the eval needs rebuilding around current
      # queries with labelled ground truth. Remove the -run filter then.
      - name: Run gated eval suite (green subset -- see comment)
        run: go test -tags eval -run 'TestEvalRetrievalQuality|TestRerankEvalRetrievalRanking|TestTokenEfficiencyEval' ./...
        working-directory: daemon
