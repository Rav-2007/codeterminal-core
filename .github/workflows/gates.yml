name: gates

# THE OFFLINE GATES, AND A SEPARATE WORKFLOW ON PURPOSE.
#
# docs-links, docs-claims, actions-pinned and go-toolchain-pinned had exactly one
# enforcement point between them: .githooks/pre-push. `core.hooksPath` is set by
# `make hooks` (Makefile) and asserted NOWHERE -- no test, no CI step -- so a
# clone that skipped one make target ran none of them, anywhere. Four gates whose
# protection depended on a human remembering, which is the failure this repo has
# now corrected four times in other places.
#
# WHY NOT A JOB IN build.yml. That workflow carries `paths-ignore: ["**.md"]`,
# and paths-ignore is workflow-level rather than per-job. A job there would
# inherit the skip, so a MARKDOWN-ONLY push -- which today starts no CI at all --
# would still run none of these. That push is precisely the commit shape that
# breaks a doc link or drifts a register, and docs-links and docs-claims are
# precisely the two gates that catch it. Putting them behind the filter that
# hides their own use case is how the previous version failed.
#
# WHY IT IS WORTH CI TIME AT ALL, beyond the missing hook: docs-claims and
# go-toolchain-pinned check CROSS-FILE invariants that a diff-shaped review
# structurally cannot see. A diff that bumps go.work and forgets one go.mod looks
# correct to a reviewer reading it hunk by hunk.
#
# Measured at 2.8s for all four including both self-tests: pure shell, no Go
# toolchain, no network. Against ~60 billable minutes for build.yml's matrix this
# is free, which is the other reason it can afford to run on every push.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: offline gates
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Each gate is its own step so a red run names which invariant broke in the
      # job list, without anyone opening the log.
      #
      # The self-tests run FIRST and separately, following `make docs`: a checker
      # that cannot demonstrate it still detects a violation is not evidence that
      # there is none. Both of these have been caught lying by their own
      # self-tests during development.
      - name: Self-tests (the checkers must still be able to fail)
        run: |
          ./scripts/docs-claims.sh --self-test
          ./scripts/go-toolchain-pinned.sh --self-test

      - name: Doc links resolve
        run: ./scripts/docs-links.sh

      # A LINK that resolves says nothing about a `file.go:123` beside it.
      # Two of the residual-risk register's four code references had drifted by
      # 2026-09-04 -- pointing at unrelated code in files still long enough that
      # nothing noticed. Opt-in per document; the count of references it did NOT
      # check is printed, so the unenforced remainder stays visible.
      - name: Code references in enforced docs resolve
        run: ./scripts/docs-coderefs.sh

      - name: Registers agree
        run: ./scripts/docs-claims.sh

      - name: GitHub Actions pinned to commit SHAs
        run: ./scripts/actions-pinned.sh

      # The release guard's logic, exercised on every push rather than only when
      # somebody cuts a release. A guard that is first run during a release is a
      # guard nobody has tested -- which is exactly how R1.15 reached a green
      # dispatch with unsigned binaries.
      - name: Release signing guard (self-test)
        run: ./scripts/release-signing-guard.sh --self-test

      # The OTHER release guard, and for the same reason. This one decides
      # whether a v* tag may release at all, by asking whether the tagged commit
      # is on the repository's default branch. It cannot be exercised by tagging
      # something, so its self-test builds a real throwaway repository with the
      # three ancestry shapes -- on the line, ahead of it, diverged from it --
      # and asserts the guard's verdict on each.
      - name: Release branch guard (self-test)
        run: ./scripts/release-branch-guard.sh --self-test

      - name: Go toolchain floor agrees across every module
        run: ./scripts/go-toolchain-pinned.sh

      # THE FUZZ GATE'S CLASSIFIER, exercised without running a fuzzer.
      #
      # fuzz.sh decides whether a non-zero `go test -fuzz` exit is a finding. It
      # used to print "this is not a fuzzing FINDING" and then fail the build
      # four lines later, because the classification and the consequence were
      # written in two places. The verdict is now one function, and this asserts
      # it against recorded outputs -- including the real output of the fuzz job
      # in run 35179379541, which took `main` down for a Go coordinator race.
      #
      # IT HAS TO BE A SELF-TEST rather than a CI run, because the condition is
      # intermittent: a green fuzz job means the race did not fire, not that the
      # handling is right. Measured at 4 failures in 15 attempts, so a run
      # confirms nothing either way. Pure shell, no Go, no network.
      - name: Fuzz outcome classifier (self-test)
        run: ./scripts/fuzz.sh --self-test

      # "Zero debt markers in non-test code" was a standing baseline invariant
      # that NOTHING enforced -- it was a manual grep over one module's flat
      # glob. Pure find/grep, so it lives in this shell-only job.
      - name: No debt markers in non-test code
        run: ./scripts/debt-markers.sh

      # THE GATE ON THE GATES, and it must run on BOTH sides or it is itself the
      # asymmetry it exists to detect -- which is what its own first run
      # reported about itself.
      #
      # `make check` and these workflows are two independently maintained
      # enumerations of what gets checked. Nothing compared them until
      # 2026-09-09, and three checks had drifted: debt-markers.sh and
      # supply-chain.sh ran only here (so nobody could run them before pushing),
      # and the coverage ratchet's vanished-floor sweep ran only locally (so it
      # could not gate a merge).
      - name: make check and CI check the same things
        run: ./scripts/gate-parity.sh

  corpus:
    name: corpus holds no answer key
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    # A SEPARATE JOB, AND RE-ANCHORED ONTO THE RIGHT AXIS.
    #
    # TestNoIndexedFileEchoesAnEvalQuery fails when a committed file contains a
    # retrieval-eval query verbatim -- the corpus then holds the eval's own
    # answer key and every recall number computed from it is inflated. That is
    # what happened between 2026-08-11 and 2026-08-28, when a captured `go test`
    # transcript sat in the indexed corpus for seventeen days.
    #
    # Its only automatic enforcement point was retrieval-eval.yml, whose trigger
    # is path-filtered to retrieval SOURCE files (chunker.go, rerank.go,
    # embedder.go, ...). But the event this test guards is COMMITTING A FILE --
    # any file, and in the incident it actually caught, a pasted transcript.
    # A transcript lands in plans/ or docs/ and touches not one path on that
    # list, so the guard did not run on the commit shape it exists for. The
    # filter was on the wrong axis: it was scoped to what changes the RANKER
    # when the hazard is what changes the CORPUS, which is every file in the
    # repository.
    #
    # Here it is anchored to every push instead, which is the axis that matches.
    # It needs the Go toolchain but neither the model nor the network, and runs
    # in ~0.6s once built; retrieval-eval.yml keeps its own copy of this step as
    # a fast pre-check before it spends fifteen minutes on numbers.
    #
    # Kept out of the `gates` job above so that job stays pure shell: a broken
    # Go setup must not take the four offline checkers down with it.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.13"
          cache-dependency-path: "**/go.sum"

      # Two assertions: no committed file echoes a query, AND the eval's ground
      # truth still resolves -- no anchor past the 3-chunk ambiguity ceiling and
      # none resolving to zero. The second needs the chunker and neither the model
      # nor the index, and was nevertheless only ever run behind twenty-two minutes
      # of BGE embedding in a path-triggered workflow.
      - name: Corpus holds no answer key, and the ground truth still resolves
        run: go test -tags eval -count=1 -run 'TestNoIndexedFileEchoesAnEvalQuery|TestEvalGroundTruthResolvesWithoutTheModel' -v ./
        working-directory: daemon

      # Supply chain: go.mod tidy across every module, and no shipped binary
      # carrying the path it was built at. Here rather than in build.yml's
      # matrix because both are whole-repo invariants that would otherwise be
      # checked six times, and because a release artifact leaking the build
      # host is not a per-module fact. Needs the Go toolchain and the module
      # cache; no network beyond what setup-go already warmed.
      - name: Supply chain (tidy, trimpath)
        run: ./scripts/supply-chain.sh
