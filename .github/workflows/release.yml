name: release

# Tag-triggered, and deliberately separate from build.yml so an ordinary push
# never pays for a release matrix. build.yml answers "is this correct?"; this
# answers "is this shippable?", and they are different questions with different
# costs.
on:
  push:
    tags: ["v*"]
  # So a release can be rehearsed without inventing a tag. Produces the same
  # artifacts and the same gates; only the upload target differs.
  workflow_dispatch:

# A second tag push must not race the first to the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # creating the GitHub Release

env:
  GO_VERSION: "1.26.9"

jobs:
  # ---------------------------------------------------------------------------
  # A v* TAG ONLY RELEASES FROM THE RELEASE LINE, and this job is the one
  # ordering error C7 found in this repository.
  #
  # BEFORE THIS EXISTED: `binaries` carried no `if:` and `package` carried none
  # either, so the condition for running a full three-platform release was
  # exactly `push` + a tag matching `v*` -- and nothing else. Expanded for a tag
  # `v0.0.2` pushed on `audit/adversarial-pass`: the trigger matches, `binaries`
  # has no gate so it runs on both runners, `package` needs only `binaries`
  # so it runs, and "Attach to the GitHub Release" is gated on
  # `startsWith(github.ref, 'refs/tags/v')` -- true for a tag on ANY ref. A
  # draft Release with binaries built from an unreviewed branch is one `git push
  # --tags` away.
  #
  # WHAT IS STOPPING THAT TODAY, measured 2026-09-16 on
  # Rav-2007/codeterminal-core: `gh api .../actions/secrets` returns
  # `{"total_count":0}`. With no MACOS_CERT_P12 the darwin marker is UNSIGNED,
  # and on a tag the signing guard fails the whole `package` job before the
  # attach step -- so zero assets publish, on every platform. A MISSING
  # CREDENTIAL IS DOING AN ACCESS-CONTROL JOB, and it stops the moment the five
  # MACOS_* secrets land. This guard exists so that ordering cannot bite.
  #
  # THE RELEASE LINE IS DERIVED, NOT HARDCODED. No branch name appears here or
  # in the script: `github.event.repository.default_branch` is the repository's
  # own declaration of its release line, read out of the event payload. Change
  # the default branch and the guard follows with no edit.
  # ---------------------------------------------------------------------------
  guard:
    name: release line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # THE WHOLE JOB DEPENDS ON THIS. A default checkout fetches the tagged
          # commit and nothing to compare it against, and the guard fails closed
          # rather than guessing -- which would turn a legitimate release red.
          # Full history is the cheap half of this job.
          fetch-depth: 0

      # Runs on workflow_dispatch too, and that is deliberate. The script's own
      # scope check short-circuits a non-tag ref, so ancestry is NOT asserted on
      # a rehearsal -- but a missing or empty release line still fails here, on
      # every event. That means a wiring error is caught by the next dispatch
      # instead of by the next release, which is the whole lesson of R1.15: a
      # guard first exercised during a release is a guard nobody has tested.
      - name: The tag must be on the release line
        run: |
          ./scripts/release-branch-guard.sh \
            --ref "${{ github.ref }}" \
            --commit "${{ github.sha }}" \
            --release-line "${{ github.event.repository.default_branch }}"

      # AND IT MUST BE THE VERSION IT SAYS IT IS. In the same job as the branch
      # guard, and before `binaries` (which `needs: guard`), so a version
      # mismatch costs nothing: no runner is spent building artifacts that are
      # mislabelled before the first one starts.
      #
      # Runs on workflow_dispatch too, and short-circuits there -- a dispatch has
      # no tag to compare against and says so rather than printing a pass. Same
      # reasoning as the branch guard above: a wiring error is then caught by the
      # next dispatch instead of by the next release.
      - name: The tag must match the version it ships
        run: |
          ./scripts/release-version-guard.sh \
            --ref "${{ github.ref }}" \
            --package-json clients/vscode/package.json

  # ---------------------------------------------------------------------------
  # Binaries are built on the OS they run on. NOT cross-compiled, and that is a
  # decision rather than an omission.
  #
  # Until 2026-10-19 it was also a necessity: `helper` required CGO, because
  # onnxruntime_go is cgo-only. helper/internal/ort now calls ONNX Runtime's C
  # API without cgo, so every binary here builds with CGO_ENABLED=0 and could be
  # cross-compiled from one runner. They stay native because each target's
  # binaries are then built on the OS whose smoke job runs them, and a signing
  # step, when one comes, has to run on macOS regardless.
  # ---------------------------------------------------------------------------
  binaries:
    name: binaries (${{ matrix.target }})
    # NOTHING IS BUILT UNTIL THE RELEASE LINE IS CONFIRMED. `needs` and not a
    # per-job `if:`, so the guard's verdict gates every downstream job through
    # one edge rather than being restated in three places that can drift.
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
          # Terminal app only (scripts/release-targets.txt says `bin`): no .vsix
          # is packaged for these two, only their install archives.
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          # Static, with no code search, for Linux on musl (release-targets.txt).
          - os: ubuntu-latest
            target: linux-x64-musl
          - os: ubuntu-24.04-arm
            target: linux-arm64-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      # THE VERSION THAT GETS STAMPED INTO THE BINARIES.
      #
      # daemon/server.go's daemonVersion was a const reading "0.1.0-skeleton"
      # and this workflow contained zero -ldflags, so every release would have
      # reported itself to clients -- and in `mochiii status` -- as a
      # pre-release skeleton. Three version sources disagreed and nothing
      # compared them.
      #
      # ON A TAG the tag IS the version, and scripts/release-version-guard.sh
      # (in the guard job) has already refused the run if package.json disagrees
      # with it -- so reading it from either place gives the same answer and the
      # tag is the one that cannot be stale.
      #
      # ON A DISPATCH there is no tag, and inventing a plausible number is the
      # failure this whole step exists to fix. A dispatch build says so in its
      # own version string and carries the commit that produced it.
      - name: Resolve the version to stamp
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "stamping version: $V"

      # ONE BINARY SINCE 1.2.0: `mochiii` is the terminal client, the daemon and
      # the embedder helper (daemon/programrole.go), built from daemon/, which
      # imports the other two as packages. Until then this job built three
      # programs, because the helper needed cgo and the daemon had to stay pure
      # Go; helper/internal/ort removed the reason (2026-10-19). One stamp,
      # main.daemonVersion, is every role's version.
      #
      # CGO_ENABLED=0, explicitly: a C toolchain on the runner must never be
      # what a build silently depends on.
      #
      # -trimpath. MEASURED without it: a plain build embedded 678 absolute
      # paths, starting with the build machine's home directory and its Go
      # installation -- the builder's username and directory layout, handed to
      # anyone who runs `strings` on a release artifact. It also makes the build
      # reproducible from a different checkout path. scripts/supply-chain.sh
      # fails if any main package produces a binary carrying one.
      # A -musl target is the same program built with -tags nosearch, which
      # leaves out ONNX Runtime's loader (helper/internal/ort/load_nosearch.go)
      # and with it purego, the one thing that links the Linux build to glibc's
      # loader: the result is static and starts on Alpine, without code search.
      - name: Build mochiii (pure Go)
        run: go build -trimpath ${{ endsWith(matrix.target, '-musl') && '-tags nosearch' || '' }} -ldflags "-X main.daemonVersion=${{ steps.version.outputs.value }}" -o "${{ github.workspace }}/dist/mochiii${{ startsWith(matrix.target, 'win32') && '.exe' || '' }}" .
        working-directory: daemon
        env:
          CGO_ENABLED: 0

      # NO SIGNING STEP, and its absence is a decision rather than an omission.
      #
      # Every target in scripts/release-targets.txt is classified `none`, so
      # there is nothing here to sign. darwin-arm64 left the set on 2026-09-17
      # and came back on 2026-10-17 as the terminal app only, delivered by the
      # one-line installer, whose curl download Gatekeeper does not quarantine
      # -- see that file's own record, and docs/RESIDUAL_RISKS.md R1.15. Its
      # .vsix stays deferred until it can be signed.
      #
      # WINDOWS IS NOT SIGNED EITHER, and that is the live cost of this shape:
      # SmartScreen warns on an unsigned .exe a browser downloaded. It WARNS,
      # where Gatekeeper KILLS a quarantined binary -- which is why an unsigned
      # Windows build is shippable everywhere and an unsigned macOS one only
      # through the installer. When an Authenticode certificate exists,
      # win32-x64 moves to `required` in that file and the signing guard starts
      # enforcing it with no change here.
      #
      # release-signing-guard.sh still runs in the `package` job. It now reports
      # that it inspected nothing, loudly, and fails if that state is ever
      # reached WITHOUT being declared -- a guard silently guarding nothing is
      # the failure this repository has corrected before.

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # One Linux runner assembles every package. vsce --target only LABELS the
  # package; the contents come from what is staged, so each target gets its own
  # platform's binaries staged before packaging, and the gate is told which
  # target it is checking.
  # ---------------------------------------------------------------------------
  package:
    name: package
    needs: binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The same version the binaries job stamped, by the same rule, handed to
      # the smoke job so it can check every installed program reports it.
      - name: Resolve the version the binaries carry
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json

      - name: Install extension deps
        run: npm ci
        working-directory: clients/vscode

      # tsc, the file readers in out/vendor/ and the one-file bundle -- the same
      # script `vsce package` runs as vscode:prepublish below, run once here so
      # a failure shows as its own step. It used to be `tsc` alone, which never
      # built out/vendor/, and verify-vsix.js requires those files.
      - name: Build the extension
        run: npm run build:package
        working-directory: clients/vscode

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Package every target
        shell: bash
        working-directory: clients/vscode
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p ../../out-vsix

          for TARGET in linux-x64 win32-x64; do # targets: vsix
            echo "::group::$TARGET"
            rm -rf daemon && mkdir -p daemon
            # THE ONE BINARY, under the daemon's name (1.2.0). Run as
            # mochiii-daemon it IS the daemon (daemon/programrole.go), so the
            # extension starts it exactly as before, and it starts its own
            # helper -- there is no second file to ship.
            #
            # No `ls a b | head -1` here, and that is not style: this script
            # runs under `set -euo pipefail`, `ls` exits 2 when one of its
            # arguments does not exist, and pipefail propagates that through
            # head -- so the assignment failed and the job died silently before
            # reaching its own error message. Caught by running the loop.
            EXE=""
            [ -f "../../artifacts/binaries-$TARGET/mochiii.exe" ] && EXE=".exe"
            SRC="../../artifacts/binaries-$TARGET/mochiii$EXE"
            [ -f "$SRC" ] || { echo "::error::mochiii missing from binaries-$TARGET"; exit 1; }
            cp -a "$SRC" "daemon/mochiii-daemon$EXE"
            chmod +x daemon/mochiii-daemon* 2>/dev/null || true

            # Stages models.json and the LICENSE, and FAILS if either binary is
            # missing rather than packaging a broken runtime.
            #
            # TOLD WHICH TARGET, like verify-vsix.js below. This loop packages
            # every target on ONE Linux runner, so the script cannot infer
            # the binary suffix from the host it is running on -- doing so is
            # what failed win32-x64 on the first real run of this workflow.
            node scripts/stage-runtime.js "$TARGET"

            OUT="../../out-vsix/mochiii-vscode-$TARGET-$VERSION.vsix"
            npx vsce package --no-dependencies --target "$TARGET" -o "$OUT"

            # THE GATE. Asserts on archive contents, told which target it is
            # checking so the win32 package is checked for .exe names.
            node scripts/verify-vsix.js "$OUT" "$TARGET"
            echo "::endgroup::"
          done

      # The standalone command-line binaries, one set per platform.
      #
      # ALL THREE, NOT JUST THE CLIENT, since 2026-09-21. This step staged only
      # mochiii-tui, and the release therefore published a terminal client
      # with nothing to talk to: clients/tui/daemonconn.go looks for a daemon
      # lockfile and fails with "daemon not found ... start it with:
      # mochiii-daemon", and no daemon was published anywhere. The daemon
      # existed only INSIDE the .vsix, so the two TUI downloads on the v0.0.2
      # release could not be used by anyone who downloaded them.
      #
      # The binaries were already built and already in the artifact -- the
      # `binaries` job produces daemon, helper and tui for every target. Only
      # this step filtered two of them out.
      #
      # THE COUNT IS ASSERTED, and derived. A staging loop that quietly found
      # nothing would publish a release with no binaries in it and exit 0 -- the
      # fail-open shape the gate audit spent a day removing from this repo's
      # scripts.
      #
      # THE EXPECTED COUNT IS ACCUMULATED IN THE INNER LOOP, and that is not
      # style. This assertion read `-eq 3` from the day it was written until
      # 2026-09-20: 43e17bc removed darwin-arm64, edited both `for TARGET in`
      # loops from three names to two, and left the 3 -- so two files were
      # staged against three demanded, `package` died before the signing guard
      # and before the attach, and a tag would have published nothing at all.
      # Writing `EXPECT=$((EXPECT + 3))` here would reintroduce the same class
      # AND be rejected by target-parity.sh's check 5, which fails any literal
      # count threshold in this file. Counting per file cannot drift from the
      # enumeration, because it IS the enumeration.
      - name: Stage the standalone binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-bin
          EXPECT=0
          for TARGET in linux-x64 win32-x64 darwin-arm64 linux-arm64 linux-x64-musl linux-arm64-musl; do # targets: all
            EXE=""
            [ "$TARGET" = "win32-x64" ] && EXE=".exe"
            SRC="artifacts/binaries-$TARGET/mochiii$EXE"
            [ -f "$SRC" ] || { echo "::error::no mochiii built for $TARGET"; exit 1; }
            # mochiii-<target>[.exe] is the naming contract the signing guard
            # keys on. It prunes by TARGET SUFFIX rather than by a list of
            # binary names, so the move from three binaries to one needed no
            # edit there.
            cp -a "$SRC" "out-bin/mochiii-$TARGET$EXE"
            # Assignment form, not ((EXPECT++)): the latter returns 1 when the
            # old value is 0, which `set -e` turns into a dead job on the first
            # iteration.
            EXPECT=$((EXPECT + 1))
          done
          N=$(find out-bin -type f | wc -l)
          [ "$N" -eq "$EXPECT" ] || { echo "::error::staged $N binaries, expected $EXPECT"; exit 1; }
          echo "staged $N standalone binaries (one per target in the loop)"
          (cd out-bin && sha256sum * | tee SHA256SUMS-bin)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terminal-client
          path: out-bin/
          retention-days: 30
          if-no-files-found: error

      # THE INSTALL ARCHIVES, since 2026-10-17: what the one-line installers
      # download. One per target, every target -- the three binaries, the
      # terminal's models.json and the licences -- built by
      # install/build-archive.sh, the same script a local rehearsal uses.
      # Their checksums and the installers' go in SHA256SUMS-archives, which
      # the installers check before installing anything. The count is
      # accumulated per archive, for the reason the staging step gives.
      - name: Build the install archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-dist
          EXPECT=0
          for TARGET in linux-x64 win32-x64 darwin-arm64 linux-arm64 linux-x64-musl linux-arm64-musl; do # targets: all
            sh install/build-archive.sh "$TARGET" "artifacts/binaries-$TARGET" out-dist
            EXPECT=$((EXPECT + 1))
          done
          N=$(find out-dist -name 'mochiii-*' -type f | wc -l)
          [ "$N" -eq "$EXPECT" ] || { echo "::error::built $N archives, expected $EXPECT"; exit 1; }
          cp install/install.sh install/install.ps1 out-dist/
          (cd out-dist && sha256sum mochiii-* install.sh install.ps1 | tee SHA256SUMS-archives)

      # EVERY MODULE IN EVERY SHIPPED BINARY HAS ITS NOTICE, on the platforms no
      # .vsix carries too. verify-vsix.js checks the two .vsix targets; this
      # runs the same rule over all four targets' binaries, so a module that is
      # linked only on macOS or ARM cannot ship without its licence. `go version
      # -m` reads a binary built for any platform.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Every shipped binary's modules are in THIRD_PARTY_LICENSES.txt
        shell: bash
        run: sh install/check-notices.sh THIRD_PARTY_LICENSES.txt artifacts/binaries-*/mochiii*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-dist
          path: out-dist/
          retention-days: 30
          if-no-files-found: error

      - name: Checksums
        shell: bash
        working-directory: out-vsix
        run: |
          sha256sum *.vsix | tee SHA256SUMS
          echo "### Packages" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix-packages
          path: out-vsix/
          retention-days: 30
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # NOTHING UNSIGNED REACHES A RELEASE.
      #
      # Placed HERE deliberately -- after both upload-artifact steps and before
      # the release attach. The guard controls what is RELEASED, not what is
      # PRODUCED: darwin is still built, still packaged, still staged, and the
      # `terminal-client` and `vsix-packages` artifacts above still contain it,
      # because rehearsing the build is the point of a dispatch. Only the input
      # to the release is pruned.
      #
      # On a dispatch an unsigned target is EXCLUDED and the job stays green.
      # On a tag it FAILS, because a tag is a release and quietly shipping fewer
      # platforms than the tag implies is its own fail-open.
      #
      # Logic lives in the script, not inline here, so it can be unit-tested and
      # neutered: `scripts/release-signing-guard.sh --self-test` runs on every
      # push. Six neuters were demonstrated failing before this was trusted.
      # ---------------------------------------------------------------------
      - name: Signing guard — nothing unsigned reaches a release
        shell: bash
        run: |
          ./scripts/release-signing-guard.sh \
            --ref "${{ github.ref }}" \
            --artifacts artifacts \
            --vsix-dir out-vsix \
            --bin-dir out-bin

      # THE NPM PACKAGES, since 1.2.0: `npm install -g mochiii`, the install
      # command that reads the same in every shell on every OS. Built from
      # out-bin AFTER the guard, so each @mochiii/<target> package carries the
      # bytes the standalone asset and the archive carry. npm/build.js reads the
      # targets from scripts/release-targets.txt and stops if
      # npm/mochiii/platform.js disagrees. The smoke job installs these offline
      # on every runner; publishing them to the npm registry is the founder's
      # step, from the tarballs the draft carries.
      - name: Build the npm packages
        shell: bash
        run: node npm/build.js --version "${{ steps.version.outputs.value }}" --bin-dir out-bin --out out-npm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: out-npm/
          retention-days: 30
          if-no-files-found: error

      # What the release gets, exactly as the guard left it, handed to the
      # attach job -- which runs only after every platform's install smoke test
      # has passed.
      - name: Collect the release's files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp out-vsix/*.vsix out-vsix/SHA256SUMS release-assets/
          cp out-bin/mochiii-* out-bin/SHA256SUMS-bin release-assets/
          cp out-dist/* release-assets/
          cp out-npm/npm-*.tgz out-npm/SHA256SUMS-npm release-assets/
          ls -l release-assets

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # THE ONE-LINE INSTALL, RUN FOR REAL ON EVERY PLATFORM IT PROMISES, before any
  # release is drafted (2026-10-17).
  #
  # Each runner serves this run's archives on 127.0.0.1 and runs the real
  # installer against them, then install/smoke/run-smoke.sh (or .ps1) checks,
  # in an isolated home: the versions, the code-search model download, a real
  # index (the embedder helper and onnxruntime running on that OS), `mochiii`
  # starting its own background service and answering through a stand-in
  # provider that must receive the project's code, a tampered archive being
  # refused, an upgrade over a running service, and uninstall. Then the same
  # run's npm packages, installed with npm; and on the two Linux runners,
  # Alpine containers for the musl build.
  #
  # windows-11-arm runs the win32-x64 build under Windows' emulation, which is
  # what the installer gives Windows on ARM. Intel Macs are not here because
  # there is no build for them: onnxruntime ships none.
  #
  # The matrix key is `runner`, not `os`: target-parity.sh reads `- os:` lines
  # in this file as the binaries matrix.
  # ---------------------------------------------------------------------------
  smoke:
    name: install smoke (${{ matrix.label }})
    needs: package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-x64
          - runner: ubuntu-24.04-arm
            label: linux-arm64
          - runner: macos-latest
            label: darwin-arm64
          - runner: windows-latest
            label: win32-x64
          - runner: windows-11-arm
            label: win32-x64 on Windows ARM
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: install-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-packages
          path: npm-dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install, index, answer, refuse a tampered download, upgrade, uninstall
        if: runner.os != 'Windows'
        shell: bash
        run: sh install/smoke/run-smoke.sh dist "${{ needs.package.outputs.version }}"
      - name: Install, index, answer, refuse a tampered download, upgrade, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install/smoke/run-smoke.ps1 -Dist dist -Version "${{ needs.package.outputs.version }}"
      # `npm install -g mochiii` from this run's tarballs, offline, in its own
      # prefix and home: the native binary behind the command, the three roles'
      # versions, an answer through the stand-in provider, and --stop. It also
      # reports, in the job summary, what an npm reinstall over a running
      # service does on this OS.
      - name: npm install -g mochiii, answer, stop
        run: node install/smoke/npm-smoke.js npm-dist "${{ needs.package.outputs.version }}"
      # Linux on musl, in Alpine containers on this runner's CPU: install.sh and
      # npm must each choose the static -musl build, which must start, answer
      # and say that code search isn't in it. See the script.
      - name: Alpine (musl), by install.sh and by npm
        if: runner.os == 'Linux'
        shell: bash
        run: sh install/smoke/alpine.sh dist npm-dist "${{ needs.package.outputs.version }}"
      # The glibc floor the install docs state, measured on the release's own
      # programs: code search on Ubuntu 18.04 (glibc 2.27), and every program
      # starting on CentOS 7 (2.17). See the script for why these two.
      - name: Code search on old glibc
        if: runner.os == 'Linux'
        shell: bash
        run: sh install/smoke/old-glibc.sh dist "${{ matrix.label }}"

  # Only a tag drafts a release, and only after every platform's smoke test
  # passed: a release whose install command fails anywhere it promises to work
  # is never drafted at all.
  attach:
    name: attach to the draft release
    needs: [package, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets
      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-assets/*
          draft: true # a human decides when it is public
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # PUBLISHING IS NOT AUTOMATIC, and this job is deliberately left un-wired.
  #
  # Marketplace publication is irreversible in practice: a bad version cannot be
  # cleanly unpublished, only superseded. There must be no automatic path from a
  # merge to a marketplace, so this runs only when a human dispatches it, only
  # against an already-built and already-gated artifact, and only once the two
  # things §5 of the plan names are true -- macOS binaries are notarised, and
  # the founder has approved the listing.
  # ---------------------------------------------------------------------------
  publish:
    name: publish (manual, founder action)
    needs: package
    if: false # flip this on deliberately, never as a side effect
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - run: echo "vsce publish runs here, from the artifacts package/ produced."
