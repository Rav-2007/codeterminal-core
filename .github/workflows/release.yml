name: release

# Tag-triggered, and deliberately separate from build.yml so an ordinary push
# never pays for a release matrix. build.yml answers "is this correct?"; this
# answers "is this shippable?", and they are different questions with different
# costs.
on:
  push:
    tags: ["v*"]
  # So a release can be rehearsed without inventing a tag. Produces the same
  # artifacts and the same gates; only the upload target differs.
  workflow_dispatch:

# A second tag push must not race the first to the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # creating the GitHub Release

env:
  GO_VERSION: "1.25.13"

jobs:
  # ---------------------------------------------------------------------------
  # A v* TAG ONLY RELEASES FROM THE RELEASE LINE, and this job is the one
  # ordering error C7 found in this repository.
  #
  # BEFORE THIS EXISTED: `binaries` carried no `if:` and `package` carried none
  # either, so the condition for running a full three-platform release was
  # exactly `push` + a tag matching `v*` -- and nothing else. Expanded for a tag
  # `v0.0.2` pushed on `audit/adversarial-pass`: the trigger matches, `binaries`
  # has no gate so it runs on both runners, `package` needs only `binaries`
  # so it runs, and "Attach to the GitHub Release" is gated on
  # `startsWith(github.ref, 'refs/tags/v')` -- true for a tag on ANY ref. A
  # draft Release with binaries built from an unreviewed branch is one `git push
  # --tags` away.
  #
  # WHAT IS STOPPING THAT TODAY, measured 2026-09-16 on
  # Rav-2007/codeterminal-core: `gh api .../actions/secrets` returns
  # `{"total_count":0}`. With no MACOS_CERT_P12 the darwin marker is UNSIGNED,
  # and on a tag the signing guard fails the whole `package` job before the
  # attach step -- so zero assets publish, on every platform. A MISSING
  # CREDENTIAL IS DOING AN ACCESS-CONTROL JOB, and it stops the moment the five
  # MACOS_* secrets land. This guard exists so that ordering cannot bite.
  #
  # THE RELEASE LINE IS DERIVED, NOT HARDCODED. No branch name appears here or
  # in the script: `github.event.repository.default_branch` is the repository's
  # own declaration of its release line, read out of the event payload. Change
  # the default branch and the guard follows with no edit.
  # ---------------------------------------------------------------------------
  guard:
    name: release line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # THE WHOLE JOB DEPENDS ON THIS. A default checkout fetches the tagged
          # commit and nothing to compare it against, and the guard fails closed
          # rather than guessing -- which would turn a legitimate release red.
          # Full history is the cheap half of this job.
          fetch-depth: 0

      # Runs on workflow_dispatch too, and that is deliberate. The script's own
      # scope check short-circuits a non-tag ref, so ancestry is NOT asserted on
      # a rehearsal -- but a missing or empty release line still fails here, on
      # every event. That means a wiring error is caught by the next dispatch
      # instead of by the next release, which is the whole lesson of R1.15: a
      # guard first exercised during a release is a guard nobody has tested.
      - name: The tag must be on the release line
        run: |
          ./scripts/release-branch-guard.sh \
            --ref "${{ github.ref }}" \
            --commit "${{ github.sha }}" \
            --release-line "${{ github.event.repository.default_branch }}"

      # AND IT MUST BE THE VERSION IT SAYS IT IS. In the same job as the branch
      # guard, and before `binaries` (which `needs: guard`), so a version
      # mismatch costs nothing: no runner is spent building artifacts that are
      # mislabelled before the first one starts.
      #
      # Runs on workflow_dispatch too, and short-circuits there -- a dispatch has
      # no tag to compare against and says so rather than printing a pass. Same
      # reasoning as the branch guard above: a wiring error is then caught by the
      # next dispatch instead of by the next release.
      - name: The tag must match the version it ships
        run: |
          ./scripts/release-version-guard.sh \
            --ref "${{ github.ref }}" \
            --package-json clients/vscode/package.json

  # ---------------------------------------------------------------------------
  # Binaries are built on the OS they run on. NOT cross-compiled, and that is a
  # decision rather than an omission.
  #
  # `helper` requires CGO -- measured: CGO_ENABLED=0 fails with
  # "onnxruntime_go: build constraints exclude all Go files". onnxruntime itself
  # is dlopen'd at runtime (ort.SetSharedLibraryPath), so a cross-build would
  # need only a C toolchain for the target and no onnxruntime at all -- mingw-w64
  # would genuinely work for Windows. macOS is where it stops: cross-building
  # needs an Apple SDK whose redistribution is constrained, and the signing and
  # notarisation steps must run on macOS regardless. Native everywhere is one
  # rule instead of two, and CI already has both runners green.
  # ---------------------------------------------------------------------------
  binaries:
    name: binaries (${{ matrix.target }})
    # NOTHING IS BUILT UNTIL THE RELEASE LINE IS CONFIRMED. `needs` and not a
    # per-job `if:`, so the guard's verdict gates every downstream job through
    # one edge rather than being restated in three places that can drift.
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      # THE VERSION THAT GETS STAMPED INTO THE BINARIES.
      #
      # daemon/server.go's daemonVersion was a const reading "0.1.0-skeleton"
      # and this workflow contained zero -ldflags, so every release would have
      # reported itself to clients -- and in `codeterminal status` -- as a
      # pre-release skeleton. Three version sources disagreed and nothing
      # compared them.
      #
      # ON A TAG the tag IS the version, and scripts/release-version-guard.sh
      # (in the guard job) has already refused the run if package.json disagrees
      # with it -- so reading it from either place gives the same answer and the
      # tag is the one that cannot be stale.
      #
      # ON A DISPATCH there is no tag, and inventing a plausible number is the
      # failure this whole step exists to fix. A dispatch build says so in its
      # own version string and carries the commit that produced it.
      - name: Resolve the version to stamp
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "stamping version: $V"

      # CGO_ENABLED is explicit on both, in opposite directions, because the
      # difference is the entire reason the helper is a separate process:
      # the daemon must stay pure Go, and CGO is confined to the helper.
      #
      # -trimpath on both. MEASURED without it on this tree: a plain build
      # embedded 678 absolute paths, starting with the build machine's home
      # directory and its Go installation -- the builder's username and
      # directory layout, handed to anyone who runs `strings` on a release
      # artifact. It also makes the build reproducible from a different
      # checkout path. scripts/supply-chain.sh fails if any main package
      # produces a binary carrying one.
      - name: Build daemon (pure Go)
        run: go build -trimpath -ldflags "-X main.daemonVersion=${{ steps.version.outputs.value }}" -o "${{ github.workspace }}/dist/codeterminal-daemon${{ matrix.target == 'win32-x64' && '.exe' || '' }}" .
        working-directory: daemon
        env:
          CGO_ENABLED: 0

      - name: Build embedder helper (CGO)
        run: go build -trimpath -o "${{ github.workspace }}/dist/codeterminal-embedder-helper${{ matrix.target == 'win32-x64' && '.exe' || '' }}" .
        working-directory: helper
        env:
          CGO_ENABLED: 1

      # THE TERMINAL CLIENT, added 2026-09-04. It was absent from this workflow
      # entirely -- recorded as R1.14, and the reason that row is now closed
      # rather than accepted: "CI goes green once before release" is not a
      # condition anything can satisfy for a target the release does not build.
      #
      # Pure Go, verified: CGO_ENABLED=0 builds it clean. It is NOT bundled into
      # the .vsix -- the extension neither references nor launches it, and a
      # copy of a 7.5 MB binary nothing runs in every package is 7.5 MB per
      # target for nothing.
      # It ships as a standalone download, attached to the Release below, which
      # is why it is also in the macOS signing list.
      - name: Build terminal client (pure Go)
        run: go build -trimpath -o "${{ github.workspace }}/dist/codeterminal-tui${{ matrix.target == 'win32-x64' && '.exe' || '' }}" .
        working-directory: clients/tui
        env:
          CGO_ENABLED: 0

      # NO SIGNING STEP, and its absence is a decision rather than an omission.
      #
      # Every target in scripts/release-targets.txt is classified `none`, so
      # there is nothing here to sign. darwin-arm64 was the only target that
      # ever required it, and it left the set on 2026-09-17 -- see that file's
      # own record, and docs/RESIDUAL_RISKS.md R1.15.
      #
      # WINDOWS IS NOT SIGNED EITHER, and that is the live cost of this shape:
      # SmartScreen warns on an unsigned .exe. It WARNS, where Gatekeeper
      # KILLS -- which is why an unsigned Windows build is shippable and an
      # unsigned macOS one was not. When an Authenticode certificate exists,
      # win32-x64 moves to `required` in that file and the signing guard starts
      # enforcing it with no change here.
      #
      # release-signing-guard.sh still runs in the `package` job. It now reports
      # that it inspected nothing, loudly, and fails if that state is ever
      # reached WITHOUT being declared -- a guard silently guarding nothing is
      # the failure this repository has corrected before.

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # One Linux runner assembles every package. vsce --target only LABELS the
  # package; the contents come from what is staged, so each target gets its own
  # platform's binaries staged before packaging, and the gate is told which
  # target it is checking.
  # ---------------------------------------------------------------------------
  package:
    name: package
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json

      - name: Install extension deps
        run: npm ci
        working-directory: clients/vscode

      - name: Compile TypeScript
        run: npx tsc -p ./
        working-directory: clients/vscode

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Package every target
        shell: bash
        working-directory: clients/vscode
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p ../../out-vsix

          for TARGET in linux-x64 win32-x64; do
            echo "::group::$TARGET"
            rm -rf daemon && mkdir -p daemon
            # NAMED, NOT `cp -a .`, since 2026-09-04. The build artifact now
            # also carries codeterminal-tui, which the extension does not launch
            # and must not ship: a wildcard copy would have silently added 7.5 MB
            # to every package, and verify-vsix.js asserts what MUST be present
            # and what MUST NOT -- it does not assert that nothing else is.
            #
            # No `ls a b | head -1` here, and that is not style: this script
            # runs under `set -euo pipefail`, `ls` exits 2 when one of its
            # arguments does not exist, and pipefail propagates that through
            # head -- so the assignment failed and the job died silently before
            # reaching its own error message. Caught by running the loop.
            for BIN in codeterminal-daemon codeterminal-embedder-helper; do
              SRC="../../artifacts/binaries-$TARGET/$BIN"
              [ -f "$SRC" ] || SRC="$SRC.exe"
              [ -f "$SRC" ] || { echo "::error::$BIN missing from binaries-$TARGET"; exit 1; }
              cp -a "$SRC" daemon/
            done
            chmod +x daemon/codeterminal-daemon* daemon/codeterminal-embedder-helper* 2>/dev/null || true

            # Stages models.json and the LICENSE, and FAILS if either binary is
            # missing rather than packaging a broken runtime.
            #
            # TOLD WHICH TARGET, like verify-vsix.js below. This loop packages
            # every target on ONE Linux runner, so the script cannot infer
            # the binary suffix from the host it is running on -- doing so is
            # what failed win32-x64 on the first real run of this workflow.
            node scripts/stage-runtime.js "$TARGET"

            OUT="../../out-vsix/codeterminal-vscode-$TARGET-$VERSION.vsix"
            npx vsce package --no-dependencies --target "$TARGET" -o "$OUT"

            # THE GATE. Asserts on archive contents, told which target it is
            # checking so the win32 package is checked for .exe names.
            node scripts/verify-vsix.js "$OUT" "$TARGET"
            echo "::endgroup::"
          done

      # The terminal client as a standalone download, one per platform.
      #
      # THE COUNT IS ASSERTED. A staging loop that quietly found nothing would
      # publish a release with no terminal client in it and exit 0 -- the
      # fail-open shape the gate audit spent a day removing from this repo's
      # scripts. As many files out as targets in, or the release fails.
      #
      # THE EXPECTED COUNT IS DERIVED FROM THE LOOP, NOT WRITTEN DOWN, and that
      # is the whole lesson of 2026-09-20. This assertion read `-eq 3` from the
      # day it was written until that morning. 43e17bc removed darwin-arm64 and
      # edited BOTH `for TARGET in` loops from three names to two -- and left
      # the 3 here, because it is a number and not a target name. Every mirror
      # target-parity.sh checks is a LIST; a count is a mirror it cannot see.
      #
      # The effect was total: two files staged, three demanded, the step exits
      # 1, `package` dies BEFORE the signing guard and BEFORE the attach. A tag
      # would have published nothing at all -- the exact failure 43e17bc's own
      # subject line claims to have fixed ("a tag now publishes instead of
      # nothing"). It was never caught because release.yml has run exactly once
      # on canonical in its existence (31505527398, 2026-08-11, at bd1bc69,
      # red), and every green rehearsal predates the removal.
      #
      # Counting in the loop body cannot drift from the loop, because it IS the
      # loop. The literal names stay so target-parity.sh still ties them to
      # scripts/release-targets.txt; the two gates compose -- parity binds the
      # loop to the source of truth, and this binds the count to the loop.
      - name: Stage the terminal client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-bin
          EXPECT=0
          for TARGET in linux-x64 win32-x64; do
            EXE=""
            [ "$TARGET" = "win32-x64" ] && EXE=".exe"
            SRC="artifacts/binaries-$TARGET/codeterminal-tui$EXE"
            [ -f "$SRC" ] || { echo "::error::no terminal client built for $TARGET"; exit 1; }
            cp -a "$SRC" "out-bin/codeterminal-tui-$TARGET$EXE"
            # Assignment form, not ((EXPECT++)): the latter returns 1 when the
            # old value is 0, which `set -e` turns into a dead job on the first
            # iteration.
            EXPECT=$((EXPECT + 1))
          done
          N=$(find out-bin -type f | wc -l)
          [ "$N" -eq "$EXPECT" ] || { echo "::error::staged $N terminal-client binaries, expected $EXPECT"; exit 1; }
          echo "staged $N terminal-client binaries (one per target in the loop)"
          (cd out-bin && sha256sum * | tee SHA256SUMS-tui)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terminal-client
          path: out-bin/
          retention-days: 30
          if-no-files-found: error

      - name: Checksums
        shell: bash
        working-directory: out-vsix
        run: |
          sha256sum *.vsix | tee SHA256SUMS
          echo "### Packages" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix-packages
          path: out-vsix/
          retention-days: 30
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # NOTHING UNSIGNED REACHES A RELEASE.
      #
      # Placed HERE deliberately -- after both upload-artifact steps and before
      # the release attach. The guard controls what is RELEASED, not what is
      # PRODUCED: darwin is still built, still packaged, still staged, and the
      # `terminal-client` and `vsix-packages` artifacts above still contain it,
      # because rehearsing the build is the point of a dispatch. Only the input
      # to the release is pruned.
      #
      # On a dispatch an unsigned target is EXCLUDED and the job stays green.
      # On a tag it FAILS, because a tag is a release and quietly shipping fewer
      # platforms than the tag implies is its own fail-open.
      #
      # Logic lives in the script, not inline here, so it can be unit-tested and
      # neutered: `scripts/release-signing-guard.sh --self-test` runs on every
      # push. Six neuters were demonstrated failing before this was trusted.
      # ---------------------------------------------------------------------
      - name: Signing guard — nothing unsigned reaches a release
        shell: bash
        run: |
          ./scripts/release-signing-guard.sh \
            --ref "${{ github.ref }}" \
            --artifacts artifacts \
            --vsix-dir out-vsix \
            --bin-dir out-bin

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            out-vsix/*.vsix
            out-vsix/SHA256SUMS
            out-bin/codeterminal-tui-*
            out-bin/SHA256SUMS-tui
          draft: true # a human decides when it is public
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # PUBLISHING IS NOT AUTOMATIC, and this job is deliberately left un-wired.
  #
  # Marketplace publication is irreversible in practice: a bad version cannot be
  # cleanly unpublished, only superseded. There must be no automatic path from a
  # merge to a marketplace, so this runs only when a human dispatches it, only
  # against an already-built and already-gated artifact, and only once the two
  # things §5 of the plan names are true -- macOS binaries are notarised, and
  # the founder has approved the listing.
  # ---------------------------------------------------------------------------
  publish:
    name: publish (manual, founder action)
    needs: package
    if: false # flip this on deliberately, never as a side effect
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - run: echo "vsce publish runs here, from the artifacts package/ produced."
