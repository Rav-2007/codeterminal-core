name: retrieval eval

# WHY THIS IS A SEPARATE WORKFLOW FILE, not a job in build.yml.
#
# The requirement was "run the real retrieval eval on a PR, but only when the
# PR touches retrieval." GitHub Actions has no job-level `paths:` filter -- path
# filtering lives on the workflow TRIGGER -- so a job inside build.yml cannot be
# path-scoped without either a third-party action or a hand-rolled `git diff`
# step whose failure mode is silently running nothing. A second workflow file
# with its own trigger is the mechanism the platform actually provides. Since
# 2026-10-16 only the push trigger is path-scoped; every pull request runs it
# (the comment on `pull_request` below says why).
#
# WHY IT EXISTS AT ALL. On 2026-08-27 a chunking change took real-repo
# chunk-level recall from 8/9 to 4/9 and shipped, because `make check` was green
# and the eval that could see it was schedule-only -- so the first report was
# six days away and the regression was already on main. The scheduled run in
# build.yml is kept for drift; this one exists so the person who changed
# retrieval is the person who learns it broke.
#
# COST. Roughly one ubuntu runner for 8-20 minutes on each pull request push,
# plus each branch push that touches the paths below. Hosted Linux minutes are
# free since the repository went public (2026-10-12), and the job is not a
# required check, so a merge never waits on it. The model download is not
# cached deliberately: a cache key that goes stale against a model change would
# fail by quietly measuring the wrong embedder, which is precisely the class of
# silent-wrong-answer this whole workflow is being added to prevent.

on:
  # EVERY PULL REQUEST, NOT ONLY RETRIEVAL ONES. Widened 2026-10-16.
  #
  # The corpus this job scores is the whole repository (evalcorpus_test.go),
  # so a change to ANY indexed file can move the score. Lines added above an
  # answer push it across a 40-line chunk boundary, and a new file can outrank
  # it. Neither touches a path on the list below. main fell from 30/49
  # retrieved at 9e9a3b8 to 29/49 at dac2f6c, under the 61% floor, and this
  # job never ran: c3dc5ea added lines above the turn's step ceiling in
  # agentloop.go, which moved the answer to "where does the agent loop stop
  # iterating" out of the overlap of two chunks and into one chunk that ranks
  # below the top 10. The first PR to touch a listed path then inherited a red
  # it did not cause. gates.yml moved the answer-key guard to every push for the
  # same reason on 2026-08-28: the hazard is what changes the CORPUS.
  #
  # Running on every PR is only half of it: a fixed floor would then turn
  # main's own 29/49 into a red on every PR. So each change is measured against
  # its own base, on the same runner -- see "Choose the base" below.
  pull_request:
    branches: [main]
  # Pushes keep the filter. A branch that changes retrieval gets the signal
  # before its PR exists (build.yml's comment records why waiting for a PR
  # inverts the order you want), and every other change is measured once, by
  # its PR, rather than twice.
  push:
    branches: ["**"]
    paths:
      # The retrieval path proper: anything that changes what gets indexed, how
      # it is embedded, how it is searched, or how results are ranked and cut.
      - "daemon/chunker.go"
      - "daemon/chunkmerge.go"
      - "daemon/chunkscrub.go"
      # The three below decide what the model RECEIVES rather than what gets
      # embedded, and were missing from this list until 2026-08-30 -- so the
      # single biggest measured change of the preceding fortnight fired nothing.
      # chunkexpand.go holds constructExtents and the delivery-expansion policy
      # (widening a hit to its enclosing declaration took the locate eval from
      # 33/49 to 39/49); chunkcontext.go holds the column-zero construct
      # heuristics it runs on, which a CRLF checkout silently defeated; and
      # repomap.go is the workspace map that goes into the same context budget.
      # A change to any of them can move recall without touching a single file
      # that was already listed here, which is precisely the failure this
      # workflow was built for.
      - "daemon/chunkcontext.go"
      - "daemon/chunkexpand.go"
      - "daemon/repomap.go"
      - "daemon/rerank.go"
      - "daemon/embedder.go"
      - "daemon/bge_embedder.go"
      - "daemon/embedderstamp.go"
      - "daemon/context.go"
      - "daemon/retrieval_setup.go"
      - "daemon/vectorstore.go"
      - "daemon/lexicalstore.go"
      - "daemon/search.go"
      - "daemon/fileclass.go"
      # defaultK lives here.
      - "daemon/index_cmd.go"
      # defaultContextBudgetChars lives here. config.go changes for plenty of
      # unrelated reasons and this will fire the job more often than it needs
      # to -- kept anyway, because on 2026-08-28 that one constant turned out to
      # be the single biggest lever on what the model actually receives (the
      # 8000-char budget was truncating 55% of eval query sets), and this job is
      # the only thing in the repo that can price a change to it.
      - "daemon/config.go"
      # The embedding helper is a separate process and a separate module; a
      # change to the tokenizer or the sequence cap changes every vector.
      - "helper/**"
      # And the daemon side of that subprocess. helperproc.go owns how every
      # embedding call is BATCHED, DEADLINED and RESTARTED, so it can fail or
      # slow this job without changing a single vector.
      #
      # Added 2026-08-30 after it did exactly that and this filter hid it: run
      # 33321602030 died on `i/o timeout` embedding a 40-chunk batch, the fix
      # went into helperproc.go, and because that file was not listed the eval
      # DID NOT RE-RUN on the commit that fixed it. Only `build` did. Third
      # instance of this miss, after the chunkexpand.go group and
      # evalcorpus_test.go above.
      - "daemon/helperproc.go"
      # The evals themselves and their fixtures. A change to the answer key is
      # exactly when you want the answer key re-run.
      - "daemon/eval_test.go"
      - "daemon/rerank_eval_test.go"
      # ADDED 2026-08-30 WITH THE FILE ITSELF. evalcorpus_test.go now builds the
      # index this job scores against -- what is scanned, what is excluded, and
      # what text is embedded all live there. A change to it can move every
      # number below without touching a single other file on this list, which is
      # the same miss the three entries above chunkexpand.go record.
      - "daemon/evalcorpus_test.go"
      - "testdata/evalset/**"
      - "testdata/queries.json"
      # And this file.
      - ".github/workflows/retrieval-eval.yml"
  workflow_dispatch:
    inputs:
      aa:
        # The precondition for gating on a base-vs-change delta: the SAME tree
        # measured twice on one runner must flip nothing. Any flip it reports
        # is noise, and the delta rule has to be widened by it.
        description: "A/A check: measure this tree against itself on one runner"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.10"

jobs:
  locate-eval:
    name: locate eval (whole-repo corpus)
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    # Generous, and explicit. build.yml's eval job died twice on `go test`'s
    # DEFAULT 10-minute timeout with the panic sitting underneath a separate
    # real failure -- a job red for two reasons teaches you about one of them.
    # 75 since 2026-10-16: a change is now measured twice (its base, then
    # itself), and one measurement alone took 12-20 minutes on PR #44.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The base below is found with merge-base, which needs main's history.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      # WHAT THIS CHANGE IS MEASURED AGAINST. Since 2026-10-16 a change is not
      # judged by fixed floors: the corpus is the whole repository, so a fixed
      # floor moves with every commit and cannot tell a loss this change caused
      # from one main already had. On 2026-10-16 main sat at 29/49 against a
      # floor of 30 and every PR that ran this job inherited the red.
      #
      # So the change's merge-base with main -- for a PR's merge commit, the
      # main it merges into -- is measured first, on THIS runner, and then the
      # change. One machine embeds identical text to identical vectors, so
      # every question that flips between the two was flipped by the change;
      # two runners differ by up to three (see evalFusionLossSlack).
      # scripts/eval-delta.sh is then the verdict: red on a NET loss, every flip
      # listed by name (owner decision, 2026-10-17).
      #
      # `single` when there is nothing to compare (a run on main itself): one
      # measurement, judged by the fixed floors, exactly as before. `aa` when
      # dispatched with aa=true: the tree against itself.
      - name: Choose the base this change is measured against
        id: base
        env:
          AA: ${{ inputs.aa }}
        run: |
          if [ "$AA" = "true" ]; then
            base=$(git rev-parse HEAD) mode=aa
          else
            base=$(git merge-base HEAD origin/main) mode=delta
            [ "$base" = "$(git rev-parse HEAD)" ] && mode=single
          fi
          echo "base $base, mode $mode"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # THE DATUM THIS JOB WAS MISSING WHILE ITS NUMBERS DEPENDED ON IT.
      # build.yml has recorded this since 2026-08-30; this job, whose entire
      # output is a set of recall figures computed from floating-point vectors,
      # did not -- so when two runs of commit 3ada6ea reported semantic-only
      # recall three queries apart on a byte-identical corpus, the logs could
      # say only `Image: ubuntu-24.04` for both. Whether those runners had
      # different core counts (which changes ONNX Runtime's reduction ORDER) or
      # different CPUs (which changes the SIMD kernels) could not be answered
      # afterwards, and the two need telling apart: the first is fixable with
      # SetIntraOpNumThreads and the second is not.
      #
      # Four lines, once per run. The next divergence starts with the answer.
      - name: Record what machine this ran on
        run: |
          echo "runner: $RUNNER_NAME  os: $RUNNER_OS  arch: $RUNNER_ARCH"
          echo "nproc: $(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
          grep -m1 'flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|avx512f|avx512_vnni|sse4_2)$' | tr '\n' ' ' || true
          echo
          free -g | head -2

      # Sub-second, no model, no network. Run it FIRST and separately: if a
      # committed file contains an eval query verbatim then the corpus holds the
      # answer key, every number below is inflated, and knowing that before
      # spending fifteen minutes on those numbers is worth its own step.
      - name: Corpus contains no copy of the answer key
        run: go test -tags eval -count=1 -run 'TestNoIndexedFileEchoesAnEvalQuery|TestEvalGroundTruthResolvesWithoutTheModel' -v ./
        working-directory: daemon

      # Scoped to the two retrieval-QUALITY evals.
      #
      # TestEvalRetrievalQuality (8 files, 22 chunks) is kept for the fast
      # offline signal it does give, but it is NOT the authority and must not be
      # read as one: at k=5 the model already sees ~23% of that corpus, and it
      # reported 14/15 throughout the 8/9 -> 4/9 regression. It is here to catch
      # a total break, not a ranking change.
      #
      # TestRerankEvalRetrievalRanking is the real gate: 49 queries against this
      # whole repository, labelled by question shape, scored as a rate.
      #
      # TestTokenEfficiencyEval is deliberately left to the Monday schedule in
      # build.yml -- it costs ~3.5 minutes and measures budget packing, not
      # ranking, so it is not what a retrieval-path PR is asking about.
      #
      # TestEditShapedRetrievalEval is excluded for the reason build.yml's eval
      # job documents at length: its harness cannot build three of its four
      # fixtures. See daemon/edit_eval_test.go's header.
      # The base, from `git archive` so it is exactly the committed tree, with
      # its OWN eval code: its ranker, its questions, its corpus. Only the
      # ranking eval runs here -- the embedder and deadline tests below are
      # about this runner, not about either tree. Its exit status is ignored
      # (its fixed floors are main's business, not this change's), but a base
      # that never reached its summary line fails the job: a comparison against
      # half a measurement is no comparison.
      - name: Locate eval, the base
        if: steps.base.outputs.mode != 'single'
        env:
          BASE: ${{ steps.base.outputs.sha }}
          EVAL_GATE: delta
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$BASE" | tar -x -C "$RUNNER_TEMP/base"
          cd "$RUNNER_TEMP/base/daemon"
          go test -tags eval -count=1 -timeout 40m -v -run 'TestRerankEvalRetrievalRanking' ./ \
            > "$RUNNER_TEMP/base.log" 2>&1 || true
          grep -E '^EVALTREND ' "$RUNNER_TEMP/base.log" \
            || { tail -40 "$RUNNER_TEMP/base.log"; echo "the base eval did not reach its summary line"; exit 1; }

      - name: Locate eval (real BGE model, whole-repo corpus)
        env:
          # Measured against its base: the fixed floors report, and the step
          # after this one decides. A run on main alone keeps them as gates.
          EVAL_GATE: ${{ steps.base.outputs.mode == 'single' && 'absolute' || 'delta' }}
        # TestFirstEmbedBatchFitsItsDeadline is here because it is CHEAP (~5s
        # once the model is cached, which the steps above have already done) and
        # because it guards the failure that took this job down on 2026-08-30:
        # one 40-chunk batch exceeding the embedder's call deadline. It measures
        # the real model's cold first batch against the deadline production
        # grants it and fails when the MARGIN erodes -- which is the only way to
        # see that coming, since a green eval is equally consistent with a fast
        # runner. It runs on this job rather than only the weekly one so the
        # signal arrives with the change that caused it.
        #
        # TestEmbeddingVariesWithThreadCount is ~18s and answers the question
        # this job's own numbers depend on: does the intra-op thread count
        # change the vectors. Refuted on a 16-core i5-1340P on 2026-08-31, but
        # that is ONE machine and this job is the only place the question gets
        # asked on anything else.
        #
        # TestAChunksVectorDoesNotDependOnItsBatch (2026-10-08, ~10s) asks the
        # question neither of those does: is a chunk's vector the same whatever
        # it was embedded beside. It was not, until the helper ran one text per
        # inference, and this list is the only thing that runs it -- a test that
        # is written and not named here compiles under `-tags eval` and proves
        # nothing, which is how it sat out the run on the commit that added it.
        run: |
          set -o pipefail
          go test -tags eval -count=1 -timeout 40m -v \
            -run 'TestEvalRetrievalQuality|TestRerankEvalRetrievalRanking|TestFirstEmbedBatchFitsItsDeadline|TestEmbeddingIsDeterministic|TestEmbeddingVariesWithThreadCount|TestAChunksVectorDoesNotDependOnItsBatch' \
            ./ 2>&1 | tee "$RUNNER_TEMP/eval.log"
        working-directory: daemon

      # THE ONNX RUNTIME BINDING AGAINST THE REAL MODEL (2026-10-19). Every
      # helper/internal/ort test that loads ONNX Runtime -- the golden vectors,
      # teardown in either order, the thread count -- skips in every other job,
      # because no other job has the model. This one has just downloaded it into
      # ~/.mochiii/models, so it runs them here.
      #
      # The golden vectors were written on another CPU, and ONNX Runtime picks
      # its int8 kernels by CPU, so here they only catch a gross error. The
      # precise check is the base tree's own helper -- the binding main ships --
      # built on this runner and compared with this change's, bit for bit
      # (TestAnotherHelperBuildComputesTheSameBits). A skipped check fails the
      # step: green must mean they ran.
      - name: The embedder helper's tests, against the real model
        run: |
          set -o pipefail
          if [ -d "$RUNNER_TEMP/base/helper" ]; then
            # Since 1.2.0 the helper is a package with a command of its own;
            # a base from before that builds from the module root.
            pkg=.
            [ -d "$RUNNER_TEMP/base/helper/cmd/mochiii-embedder-helper" ] && pkg=./cmd/mochiii-embedder-helper
            (cd "$RUNNER_TEMP/base/helper" && go build -o "$RUNNER_TEMP/base-helper" "$pkg")
            export MOCHIII_OTHER_HELPER="$RUNNER_TEMP/base-helper"
          fi
          go test -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/helper.log" | grep -vE '^=== (RUN|PAUSE|CONT)'
          grep -q -- '--- PASS: TestTheBindingComputesTheGoldenVectors' "$RUNNER_TEMP/helper.log" \
            || { echo "the golden-vector test did not run: the model is not where the helper's tests look"; exit 1; }
          if [ -n "${MOCHIII_OTHER_HELPER:-}" ]; then
            grep -q -- '--- PASS: TestAnotherHelperBuildComputesTheSameBits' "$RUNNER_TEMP/helper.log" \
              || { echo "the base helper was built but the bit-for-bit comparison did not pass"; exit 1; }
          fi
        working-directory: helper

      # The verdict for a change measured against its base. `always()` so a
      # change whose eval run failed for another reason still shows what it did
      # to the questions. A missing or unfinished log is eval-delta.sh's exit 2,
      # never a pass.
      - name: What this change did, question by question
        if: always() && steps.base.outputs.mode != 'single'
        env:
          BASE: ${{ steps.base.outputs.sha }}
          MODE: ${{ steps.base.outputs.mode }}
        run: |
          {
            echo "### What this change did to the locate eval"
            echo "Measured against \`${BASE:0:7}\` on this runner ($MODE)."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          ./scripts/eval-delta.sh "$RUNNER_TEMP/base.log" "$RUNNER_TEMP/eval.log" > "$RUNNER_TEMP/delta.md" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/delta.md"
          cat "$RUNNER_TEMP/delta.md" >> "$GITHUB_STEP_SUMMARY"
          # A/A: the same tree twice. Netting out is not enough here -- any flip
          # at all is noise this rule has not accounted for.
          if [ "$MODE" = aa ] && ! grep -q '^No question changed\.' "$RUNNER_TEMP/delta.md"; then
            echo "A/A FAILED: the same tree measured twice on one runner flipped questions" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit $rc

      # The one line worth carrying out of a 20-minute log, promoted to the
      # job summary so the series in docs/RETRIEVAL_EVAL_TREND.md can be
      # appended by copying rather than by re-reading the whole run.
      #
      # `if: always()` because a RED run is exactly when the trend line matters:
      # it is what says whether the corpus grew or the ranker moved.
      - name: Trend line
        if: always()
        run: |
          echo '### Retrieval eval' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^EVALTREND ' "$RUNNER_TEMP/eval.log" >> "$GITHUB_STEP_SUMMARY" \
            || echo 'no EVALTREND line (the ranking eval did not reach its summary)' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'vector fingerprint:' "$RUNNER_TEMP/eval.log" >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f "$RUNNER_TEMP/base.log" ]; then
            echo "base:" >> "$GITHUB_STEP_SUMMARY"
            grep -E '^EVALTREND ' "$RUNNER_TEMP/base.log" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          # The fixed floors, reported rather than gating when there was a base.
          grep -E '^GATE\(report\): ' "$RUNNER_TEMP/eval.log" | cut -c1-240 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
