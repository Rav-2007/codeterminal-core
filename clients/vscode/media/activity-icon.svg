<!--
  The activity-bar icon. A lotus, which is the product's mark.

  VS Code MASKS this icon: it discards the colours and keeps the alpha, then
  paints the result in the theme's own activity-bar foreground (dimmed when
  inactive, full when active, with the theme's badge colours on top). So the
  file is deliberately a single flat shape in currentColor -- any palette put
  here would be thrown away, and a multi-tone icon would come out as one
  silhouette whose detail had merged into a blob.

  24x24 with the art inset to roughly 20x20, which is what the other activity
  icons leave as breathing room; a shape drawn to the full 24 looks a size
  larger than its neighbours.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
  <!-- Centre petal. -->
  <path d="M12 3.2c1.7 2.1 2.6 4.3 2.6 6.4 0 1.7-.6 3.3-1.8 4.8h-1.6c-1.2-1.5-1.8-3.1-1.8-4.8 0-2.1.9-4.3 2.6-6.4z"/>
  <!-- Inner pair, leaning out from the centre. -->
  <path d="M7.4 6.6c2 1.3 3.3 2.9 3.9 4.7.3 1 .3 2-.1 3l-1.3.8c-1.2-.6-2.2-1.5-2.9-2.7-1-1.8-1.2-3.9-.5-6.3z"/>
  <path d="M16.6 6.6c.7 2.4.5 4.5-.5 6.3-.7 1.2-1.7 2.1-2.9 2.7l-1.3-.8c-.4-1-.4-2-.1-3 .6-1.8 1.9-3.4 3.9-4.7z"/>
  <!-- Outer pair, nearly horizontal, which is what reads as "lotus" at 16px. -->
  <path d="M3.6 11.3c2.4.1 4.3.7 5.7 1.8.8.6 1.4 1.4 1.7 2.3l-.6 1.4c-1.3.2-2.5 0-3.7-.6-1.8-.9-3.1-2.5-3.9-4.7z"/>
  <path d="M20.4 11.3c-.8 2.2-2.1 3.8-3.9 4.7-1.2.6-2.4.8-3.7.6l-.6-1.4c.3-.9.9-1.7 1.7-2.3 1.4-1.1 3.3-1.7 5.7-1.8z"/>
  <!-- Base, so the petals sit on something rather than floating. -->
  <path d="M12 17.6c2.6 0 4.8.9 6.6 2.6-2.1.9-4.3 1.4-6.6 1.4s-4.5-.5-6.6-1.4c1.8-1.7 4-2.6 6.6-2.6z"/>
</svg>
